<script>
/* A FLOOR UNDER THE SHARED FAILURE TREATMENT - do not remove.
   The real window.LifecycleFailure ships in auth.js, which every page loads
   DEFERRED, and a page can also be opened with no auth.js at all (a file://
   harness, a blocked request). A catch block that throws because the helper is
   missing aborts the whole render: the operator presses the button, the request
   fails, and NOTHING on the page changes - strictly worse than the bare code
   this treatment replaced. So each page installs this minimal stub before any
   of its own script runs, and auth.js overwrites it with the real one the
   moment it loads. Every call site is identical either way.
   Deliberately duplicated per page: it has to exist before any shared file can
   be fetched, which is the one thing a shared file cannot do for itself.
   Built with textContent, so a server string can never arrive as markup. */
window.LifecycleFailure = window.LifecycleFailure || (function () {
  var IDENT = /^[a-z][a-z0-9]*(?:[_.\-][a-z0-9]+)+$/;
  function sentence(e) {
    var s = String((e && (e.message || e.error)) || e || '').trim();
    return (!s || IDENT.test(s)) ? 'This could not be loaded, and the server did not say why.' : s;
  }
  function html(e, o) {
    var d = document.createElement('div');
    d.className = 'vh-failure'; d.setAttribute('role', 'alert'); d.setAttribute('data-failure', '1');
    var t = document.createElement('span'); t.className = 'vh-failure-tag';
    t.textContent = (o && o.title) || 'Could not load';
    var m = document.createElement('span'); m.className = 'vh-failure-msg';
    m.textContent = sentence(e);
    d.appendChild(t); d.appendChild(document.createTextNode('\n')); d.appendChild(m);
    if (o && o.extra) {
      var x = document.createElement('span'); x.className = 'vh-failure-msg';
      x.textContent = o.extra;
      d.appendChild(document.createTextNode('\n')); d.appendChild(x);
    }
    return d.outerHTML;
  }
  function rowHtml(e, o) {
    return '<tr class="vh-failure-tr"><td colspan="' + ((o && o.colspan) || 99) + '">' + html(e, o) + '</td></tr>';
  }
  return {
    sentence: sentence,
    code: function () { return ''; },
    unreachable: function () { return false; },
    html: html,
    rowHtml: rowHtml,
    show: function (el, e, o) {
      if (!el) return;
      var g = (el.tagName || '').toUpperCase();
      el.innerHTML = g === 'TBODY' ? rowHtml(e, o)
        : (g === 'TABLE' ? '<tbody>' + rowHtml(e, o) + '</tbody>' : html(e, o));
    },
  };
})();
</script>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtDate = (d) => { try { return new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); } catch { return ''; } };
  const now = () => new Date().toISOString();

  let SCOPE = 'mine', TYPE = 'all', Q = '';
  let ITEMS = [];               // unified asset list
  const byId = {};              // id → item (for action lookups)
  let usingLocal = false;

  const sbClient = () => (window.LifecycleAuth && window.LifecycleAuth.client) || null;
  const myEmail  = () => { const u = (window.LifecycleAuth && window.LifecycleAuth.user) || null; return (u && u.email) || ''; };

  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
  function copyText(txt, okMsg) {
    const done = (ok) => toast(ok ? (okMsg || 'Copied to clipboard') : 'Could not copy — see console');
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); return; } } catch (_) {}
    try { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(true); } catch (_) { console.log(txt); done(false); }
  }

  function waitForClient(ms) {
    return new Promise((resolve) => { const t0 = Date.now(); (function poll() {
      if (sbClient()) return resolve(true);
      if (Date.now() - t0 > ms) return resolve(false);
      setTimeout(poll, 150);
    })(); });
  }

  // ─── Portable, role-primed AI prompts (paste into Claude / Gemini / ChatGPT) ───
  // Mirrors api/_shared/master-prompt.js so the copied prompt is brand-locked and
  // self-contained. Each ends with a SELF-CHECK so the model QAs its own output.
  const REGION = {
    US:{store:'knickgasm.com',cur:'$'}, UK:{store:'knickgasm.com',cur:'£'}, IN:{store:'knickgasm.com',cur:'₹'},
    EU:{store:'knickgasm.com',cur:'€'}, AU:{store:'knickgasm.com',cur:'A$'}, Global:{store:'knickgasm.com',cur:'$'}
  };
  // The brand block is the ACTIVE brand's own record (2026-10-11). It was six
  // literals of tenant zero's palette, fonts, voice, banned list and claims,
  // pasted into every prompt this page copied, for every brand.
  function activeBrand() { try { return (window.BrandContext && window.BrandContext.brand) || null; } catch (_) { return null; } }
  function brandName() { const b = activeBrand(); return (b && b.name) || '[DATA REQUIRED BEFORE LAUNCH: brand name]'; }
  function brandBlock() {
    const b = activeBrand() || {};
    const p = b.palette || {}, t = b.typography || {}, v = b.voice || {};
    const name = brandName();
    const need = (what) => '[DATA REQUIRED BEFORE LAUNCH: ' + what + ', ' + name + ']';
    const roles = ['primary', 'accent', 'ink', 'surface'].filter((k) => p[k]).map((k) => k + ' ' + p[k]);
    const claims = (b.claims || (b.brand_data && b.brand_data.claims) || []).map((c) => (c && typeof c === 'object' ? c.text : c)).filter(Boolean);
    const stack = (slot) => (t[slot] && (t[slot].stack || t[slot].family)) || '';
    return [
      'BRAND RULES (strict — obey exactly):',
      '- Palette, ONLY these: ' + (roles.length ? roles.join(', ') : need('palette')) + '.',
      '- Headings: ' + (stack('heading') || need('heading typeface')) + '. Body: ' + (stack('body') || need('body typeface')) + '.',
      '- Voice: ' + (v.tone || need('voice')) + (Array.isArray(v.preferred) && v.preferred.length ? ' Prefer: ' + v.preferred.join(', ') + '.' : ''),
      (Array.isArray(v.banned) && v.banned.length ? '- NEVER use: ' + v.banned.join(', ') + '.' : '- NEVER use a phrase the brand record bans.'),
      '- ' + name + ': ' + (claims.length ? claims.join(' · ') : need('verifiable claims') + ' — state no proof, guarantee or credential.')
    ].join('\n');
  }
  function head(role, market) {
    const f = REGION[market] || REGION.US;
    // The store is the ACTIVE brand's own (2026-10-05); the literal map stands
    // only when no brand is active.
    const B = window.BrandContext && window.BrandContext.brand;
    const store = B
      ? (((window.BrandCatalog && window.BrandCatalog.storeBase(market)) || B.website || '').replace(/^https?:\/\//, '') ||
         ('[DATA REQUIRED BEFORE LAUNCH: store URL, ' + (B.name || 'brand name') + ', ' + market + ']'))
      : f.store;
    // The market's currency from the brand's own regions, never a literal.
    const reg = B ? (B.regions || []).find((x) => x && String(x.code || '').toUpperCase() === String(market || '').toUpperCase()) : null;
    const cur = B ? ((reg && reg.currency) || ('[DATA REQUIRED BEFORE LAUNCH: currency, ' + (B.name || 'brand name') + ', ' + market + ']')) : f.cur;
    return 'ROLE: ' + role + '\nMARKET: ' + market + ' (store ' + store + ', currency ' + cur + ' — all prices/copy in ' + cur + ').\n\n' + brandBlock() + '\n\n';
  }
  const SELF_CHECK = '\n\nSELF-CHECK (do this before finishing): re-read the BRAND RULES, list any violations in your draft (off-palette colours, banned phrases, wrong fonts, wrong currency), fix them, and return ONLY the corrected final output.';

  function buildPrompt(item) {
    const r = item.raw || {}, market = item.market || r.region || ((window.RegionContext && window.RegionContext.home) || '');
    if (item.kind === 'landing') {
      const channel = r.channel || 'landing';
      return head('You are a senior D2C conversion copywriter + front-end developer for ' + brandName() + '.', market) + [
        'Build a COMPLETE, production-ready, single-file responsive HTML landing page that converts ' + channel + ' traffic.',
        '',
        'PAGE BRIEF:',
        '- Hero headline: ' + (r.hero || item.name || '(write a strong, specific one)'),
        '- Sub-headline: ' + (r.sub || '(write a supporting line)'),
        '- Offer: ' + (r.offer || '(sell on quality, provenance and ritual — no forced discount)'),
        r.notes ? '- Extra notes / story: ' + r.notes : '',
        '- Channel intent: ' + channel + ' — mobile-first, one clear primary CTA.',
        '',
        'REQUIRED STRUCTURE: announcement bar; hero (headline + sub + CTA + product image placeholder); trust strip; benefits; product/offer block with price; social proof (only quotes this brief supplies, else the DATA REQUIRED marker); FAQ; final CTA; footer; sticky mobile CTA.'
      ].filter(Boolean).join('\n') + SELF_CHECK + '\n\n' + outputBlock('landing', market, {
        returns: 'ONE complete, production-ready, single-file responsive landing page as an HTML document.',
        formatRule: 'ONE HTML document, from <!doctype html> to </html>.',
        lines: ['Inline CSS, no external dependencies (no CDN, no web-font link, no framework).'] });
    }
    if (item.kind === 'ad') {
      const platform = (r.channel || 'meta').toUpperCase();
      return head('You are a senior paid-social creative director + performance copywriter for ' + brandName() + '.', market) + [
        'Produce a scroll-stopping ' + platform + ' ad creative package.',
        '',
        'AD BRIEF:',
        '- Concept / product: ' + (item.name || '(pick a hero SKU and a single emotional end-state)'),
        r.headline ? '- Existing headline to improve on: ' + r.headline : '',
        r.offer ? '- Offer: ' + r.offer : '',
        r.hook ? '- Hook direction: ' + r.hook : '',
        '',
      ].filter(Boolean).join('\n') + SELF_CHECK + '\n\n' + outputBlock('ad', market, {
        format: 'sections',
        returns: 'ONE complete ' + platform + ' ad creative package, ready to paste into the ' + platform + ' ad builder.',
        formatRule: 'These four labelled sections, in this order:',
        lines: [
          '1) HEADLINES: 3 options (6 words at most) leading with the emotional end-state, never an ingredient list.',
          '2) PRIMARY TEXT: at most 125 characters, then a 1-line description and a strong CTA.',
          '3) IMAGE PROMPT: a photoreal lifestyle scene in the brand palette, soft natural light, shallow depth of field; NO readable lettering, NO logos, NO watermarks.',
          '4) AUDIENCE: which cohort this is aimed at and why (only one the brief or the brand record names, else the DATA REQUIRED marker).'
        ] });
    }
    // mailer
    return head('You are a senior lifecycle-email creative director + front-end email developer for ' + brandName() + '.', market) + [
      'Build a COMPLETE, production-ready, responsive HTML marketing email (compact, ~1200–1500px tall, two scrolls max).',
      '',
      'EMAIL BRIEF:',
      '- Campaign: ' + (r.campaign_title || item.name || '(name it)'),
      r.type ? '- Type / moment: ' + r.type : '',
      r.brief ? '- Brief / story: ' + r.brief : '- Brief: write a warm, sensory, story-driven campaign around origin + ritual.',
      '',
      'REQUIRED STRUCTURE: preheader; branded header; hero (headline + sub + CTA + product image placeholder); story/benefit block; product block with price + CTA; a testimonial ONLY if this brief supplies one (else leave it out); secondary CTA; footer with unsubscribe.'
    ].filter(Boolean).join('\n') + SELF_CHECK + '\n\n' + outputBlock('mailer', market, {
      returns: 'ONE complete, production-ready, responsive HTML marketing email.',
      formatRule: 'ONE HTML email document, from <!DOCTYPE html> to </html>.',
      lines: ['Table-based, inbox-safe layout with every style inline; a 600px content column; it reads completely with images turned off.'] });
  }
  // The OUTPUT REQUIREMENT every prompt here ends with (/output-contract.js,
  // shared with the server's prompts). The SELF-CHECK sits above it, so the
  // last thing the model reads is what to return and in what container.
  function outputBlock(kind, market, o) {
    const B = window.BrandContext && window.BrandContext.brand;
    return window.OutputContract.block(Object.assign({
      id: 'assets.' + kind, kind: 'asset', format: 'html', region: market,
      brand: (B && B.name) || 'this brand',
      forbid: ['base64 or data: URIs (images are hosted URLs)', 'a plan or a description of the asset in place of the asset']
    }, o));
  }

  // ─── localStorage sources (carry the fuller objects needed to clone/prompt) ──
  /* WHICH brand, and which version of it, an asset was made for (2026-10-11).
     The libraries this page lists from used to be one flat list per browser
     (the Studio's 'vhd_logs', the landing builder's 'lp-<channel>') and one
     unfiltered read per shared table, so a brand saw every brand's mailers,
     ads and pages, and a renamed brand saw the earlier one's as its own. The
     local lists are now kept per brand version (LCStore's key carries the
     record's fingerprint, brand-identity.js); a shared row is listed only when
     it is THIS workspace's and carries this version's fingerprint. Anything
     else is kept where it is, not listed, and counted in a sentence. */
  function scopedKey(k) { try { return (window.LCStore && window.LCStore.key) ? window.LCStore.key(k) : k; } catch (_) { return k; } }
  const LOGS_KEY = () => scopedKey('vhd_logs_v2');
  const LP_KEY = (ch) => scopedKey('lp-lib-' + ch);
  let HIDDEN = 0;
  /* Earlier versions of THIS brand are viewable on request (2026-10-14). The
     operator saw "51 asset(s) ... not listed" beside tabs that all read 0, with
     no way to reach any of them. A row of this workspace (or one saved before
     rows named a workspace) made for an earlier version of the record is kept
     in EARLIER and listed, labelled, when "Show" is pressed. A row of another
     workspace is another brand's and is never listed under this one. */
  let EARLIER = [];
  let OTHER_BRAND = 0;
  let SHOW_EARLIER = false;
  function currentOnly(rows) {
    const b = activeBrand();
    const ident = b && b.identity, ws = b && b.id;
    return (rows || []).filter((r) => {
      const mine = !!ident && r.stamp === ident && (!r.ws || r.ws === ws);
      if (!mine) {
        HIDDEN++;
        if (r.ws && ws && r.ws !== ws) OTHER_BRAND++;
        else EARLIER.push(Object.assign(r, { earlier: true }));
      }
      return mine;
    });
  }
  function localMailers() {
    try { return (JSON.parse(localStorage.getItem(LOGS_KEY()) || '[]')).map((e) => ({
      kind: 'mailer', name: (e._full && e._full.campaign_title) || e.prompt || '(mailer)',
      market: (e.markets && e.markets[0]) || (e._full && e._full.primary_market) || '', tag: e.type || '',
      created_at: e.date || new Date(e.id || Date.now()).toISOString(), email: e.userEmail || '',
      html: (e._full && (e._full.variant_a_html || e._full.email_html || (e._full.assets && e._full.assets.email && e._full.assets.email.html) || e._full.html)) || '',
      image: (e._full && (e._full.hero_image_url || e._full.thumbnail_url || e._full.hero_product_image)) || '',
      raw: { campaign_title: (e._full && e._full.campaign_title) || e.prompt || '', type: e.type || '', market: (e.markets && e.markets[0]) || '', brief: e.prompt || (e._full && e._full.brief) || '' }
    })); } catch { return []; }
  }
  function localAds() {
    try { const s = JSON.parse(LCStore.get('knickgasm-ads-v1') || '{}'); const out = [];
      ['google','meta','tiktok'].forEach((ch) => (s[ch] || []).forEach((c) => out.push({
        kind: 'ad', name: c.name || '(ad)', market: c.market || '', tag: ch, channel: ch, image: c.image || '',
        created_at: new Date(parseInt((c.id || '').toString().slice(0, 8), 36) || Date.now()).toISOString(), email: '',
        raw: { channel: ch, market: c.market || '', headline: c.overlay_headline || c.headline || '', offer: c.offer || '', hook: c.hook || '', primary: c.primary || '' }
      })));
      return out; } catch { return []; }
  }
  function localLanding() {
    const out = [];
    ['mailers','meta','google','tiktok'].forEach((ch) => { try {
      (JSON.parse(localStorage.getItem(LP_KEY(ch)) || '[]')).forEach((p) => out.push({
        kind: 'landing', name: p.hero || '(landing page)', market: p.region || '', tag: ch === 'mailers' ? 'mailer' : ch,
        offer: p.offer || '', created_at: p.created_at || now(), email: '',
        raw: { hero: p.hero || '', sub: p.sub || '', offer: p.offer || '', notes: p.notes || '', region: p.region || '', channel: ch === 'mailers' ? 'mailer' : ch }
      }));
    } catch {} });
    return out;
  }

  async function sbFetch(table, map) {
    const sb = sbClient(); if (!sb) return null;
    try { const { data, error } = await sb.from(table).select('*').order('created_at', { ascending: false }).limit(500);
      if (error) { console.warn('[assets] ' + table + ':', error.message); return null; }
      return (data || []).map(map);
    } catch (e) { console.warn('[assets] ' + table + ' error:', e && e.message); return null; }
  }

  const key = (it) => [it.kind, (it.name || '').toLowerCase(), it.market || '', it.tag || '', it.offer || ''].join('|');
  function mergeDedup(remote, local) {
    const seen = new Set(), out = [];
    (remote || []).concat(local || []).forEach((it) => { const k = key(it); if (seen.has(k)) return; seen.add(k); out.push(it); });
    return out;
  }

  async function buildAll() {
    const haveClient = await waitForClient(4000);
    usingLocal = false;

    let mRemote = haveClient ? await sbFetch('mailers_generated', (d) => ({
      kind: 'mailer', name: d.campaign_title || d.prompt_short || '(mailer)', market: d.primary_market || '', tag: d.campaign_type || '',
      created_at: d.created_at, email: d.user_email || '',
      stamp: (d.reasoning && d.reasoning.brand_identity) || '', ws: d.workspace_id || '',
      html: d.variant_a_html || (d.market_mailers && (() => { try { const mm = typeof d.market_mailers === 'string' ? JSON.parse(d.market_mailers) : d.market_mailers; const m = mm && (mm[d.primary_market] || mm[Object.keys(mm)[0]]); return (m && (m.A || m.a)) || ''; } catch { return ''; } })()) || '',
      image: d.thumbnail_url || d.canvas_image_url || d.hero_image_url || d.hero_product_image || '',
      raw: { campaign_title: d.campaign_title || '', type: d.campaign_type || '', market: d.primary_market || '', brief: d.prompt || d.prompt_short || d.brief || '' }
    })) : null;
    if (mRemote === null) { usingLocal = true; mRemote = []; }

    let aRemote = haveClient ? await sbFetch('ads_generated', (d) => ({
      kind: 'ad', name: d.name || '(ad)', market: d.market || '', tag: d.channel || '', channel: d.channel || '', image: d.creative_url || '',
      created_at: d.created_at, email: d.user_email || '',
      stamp: (d.copy && d.copy.brand_identity) || '', ws: d.workspace_id || '',
      raw: { channel: d.channel || 'meta', market: d.market || '', headline: d.overlay_headline || d.headline || '', offer: d.offer || '', hook: d.hook || '', primary: d.primary || '' }
    })) : null;
    if (aRemote === null) { usingLocal = true; aRemote = []; }

    let lRemote = haveClient ? await sbFetch('landing_pages_generated', (d) => ({
      kind: 'landing', name: d.hero || d.name || '(landing page)', market: d.market || '', tag: d.paired_with || '', offer: d.offer || '',
      created_at: d.created_at, email: d.user_email || '',
      stamp: (d.payload && d.payload.brand_identity) || '', ws: d.workspace_id || '',
      raw: { hero: d.hero || '', sub: d.sub || '', offer: d.offer || '', notes: d.notes || '', region: d.market || '', channel: (d.paired_with === 'mailer' ? 'mailer' : d.paired_with) || 'mailer' }
    })) : null;
    if (lRemote === null) { usingLocal = true; lRemote = []; }

    // Local lists are this brand version's own (their key says so); shared
    // rows are judged one by one.
    HIDDEN = 0; EARLIER = []; OTHER_BRAND = 0;
    const localStamp = (rows) => rows.map((r) => Object.assign(r, { stamp: (activeBrand() || {}).identity || '', ws: '' }));
    ITEMS = [].concat(
      mergeDedup(currentOnly(mRemote), localStamp(localMailers())),
      mergeDedup(currentOnly(aRemote), localStamp(localAds())),
      mergeDedup(currentOnly(lRemote), localStamp(localLanding()))
    ).concat(SHOW_EARLIER ? EARLIER : []).map((it, i) => { it._id = it.kind + '_' + i; byId[it._id] = it; return it; });

    ITEMS = applyScope(ITEMS);
    ITEMS.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
  }

  function applyScope(rows) {
    if (SCOPE === 'all') return rows;
    const me = myEmail(); if (!me) return rows;
    return rows.filter((r) => !r.email || r.email === me);
  }

  function counts() {
    const c = { all: ITEMS.length, mailer: 0, ad: 0, landing: 0 };
    ITEMS.forEach((it) => { c[it.kind]++; });
    return c;
  }

  function render() {
    const c = counts();
    Object.keys(c).forEach((k) => { const el = document.querySelector('[data-tabn="' + k + '"]'); if (el) el.textContent = c[k]; });
    const q = Q.trim().toLowerCase();
    const rows = ITEMS.filter((it) => (TYPE === 'all' || it.kind === TYPE))
      .filter((it) => !q || [it.name, it.market, it.tag].join(' ').toLowerCase().includes(q));
    const grid = $('#grid');
    // What was not listed, and why, in one sentence in the accent rule.
    let note = document.getElementById('hiddenNote');
    if (!note && grid && grid.parentNode) {
      note = document.createElement('p');
      note.id = 'hiddenNote'; note.setAttribute('data-hidden-assets', '');
      note.style.cssText = 'margin:0 0 12px;padding:8px 12px;border-left:3px solid var(--vh-accent, currentColor);color:var(--vh-ink, inherit)';
      grid.parentNode.insertBefore(note, grid);
    }
    if (note) {
      note.hidden = !HIDDEN;
      note.textContent = '';
      if (HIDDEN) {
        const nE = EARLIER.length, nO = OTHER_BRAND, bn = brandName();
        const parts = [];
        if (nE) parts.push((nE === 1 ? '1 asset was' : nE + ' assets were') + ' made for an earlier version of ' + bn
          + ' (its name, website, sender, catalogue, palette, type, voice, claims or market has changed since). '
          + (SHOW_EARLIER ? 'They are listed below, marked "Earlier version": check them against ' + bn + '\'s current record before reusing one.' : 'They are kept, and not mixed in with the current ones.'));
        if (nO) parts.push((nO === 1 ? '1 asset belongs' : nO + ' assets belong') + ' to another brand you have access to, so ' + (nO === 1 ? 'it is' : 'they are') + ' listed under that brand, not here.');
        const t = document.createElement('span'); t.textContent = parts.join(' '); note.appendChild(t);
        if (nE) {
          const btn = document.createElement('button');
          btn.type = 'button'; btn.className = 'abtn'; btn.id = 'toggleEarlier'; btn.setAttribute('data-toggle-earlier', '');
          btn.style.marginLeft = '8px';
          btn.textContent = SHOW_EARLIER ? 'Hide earlier versions' : 'Show the ' + nE + ' from earlier versions';
          btn.addEventListener('click', async () => { SHOW_EARLIER = !SHOW_EARLIER; await buildAll(); render(); });
          note.appendChild(btn);
        }
      }
    }
    if (!rows.length) {
      // Three different reasons produce an empty grid, and conflating them
      // makes an unreachable database look like a brand that has generated
      // nothing. Each is named.
      const why = q || TYPE !== 'all'
        ? 'No assets match this search or type filter. Clear the filters to see everything.'
        : usingLocal
          ? 'No assets found. The shared database could not be read, so only this browser\'s assets are listed and there are none here.'
          : (EARLIER.length && !SHOW_EARLIER)
            ? 'Nothing has been made for the current version of ' + brandName() + ' yet. Press "Show the ' + EARLIER.length + ' from earlier versions" above to see what was made before.'
          : 'No assets here yet. Generate some in the Studio, Ad Campaigns or Landing Pages — they show up here to preview, clone and re-prompt.';
      grid.innerHTML = '<div class="empty">' + esc(why) + '</div>';
      return;
    }
    grid.innerHTML = rows.map((it) => {
      // A mailer/landing card should preview the ACTUAL rendered document. When we
      // hold its HTML, render it live in a scaled iframe (the real mailer), not the
      // raw product photo. Ads (which ARE an image) still show their creative image;
      // otherwise fall back to a brand glyph placeholder.
      let thumb, hasView = false;
      if (it.html && (it.kind === 'mailer' || it.kind === 'landing')) {
        thumb = '<div class="thumb-wrap"><iframe sandbox srcdoc="' + esc(it.html) + '" loading="lazy" title="preview"></iframe>'
          + '<button type="button" class="thumb-open" data-act="view" data-id="' + it._id + '" aria-label="Open preview"></button></div>';
        hasView = true;
      } else if (it.kind === 'ad' && it.image) {
        thumb = '<img class="thumb" src="' + esc(it.image) + '" alt="" loading="lazy">';
      } else {
        thumb = '<div class="thumb ph">' + (it.kind === 'mailer' ? '✉' : it.kind === 'ad' ? '📣' : '🖥') + '</div>';
      }
      const meta = [it.market, fmtDate(it.created_at)].filter(Boolean).join(' · ');
      const previewBtn = hasView
        ? '<button type="button" class="abtn" data-act="view" data-id="' + it._id + '">Preview</button>'
        : '<a class="abtn" href="' + esc(it.kind === 'mailer' ? '/studio' : it.kind === 'ad' ? '/ads' : '/landing') + '" target="_blank" rel="noopener">Open in tool</a>';
      return '<div class="asset">' + thumb +
        '<div class="pad">' +
          '<div class="name">' + esc(it.name) + '</div>' +
          '<div class="meta">' + (it.earlier ? '<span class="tag" data-earlier-version>Earlier version</span>' : '') + '<span class="tag ' + it.kind + '">' + (it.kind === 'landing' ? 'Landing' : it.kind === 'ad' ? esc(it.tag || 'Ad') : 'Mailer') + '</span>' + esc(meta) + '</div>' +
          '<div class="acts">' +
            previewBtn +
            '<button type="button" class="abtn" data-act="clone" data-id="' + it._id + '">⧉ Clone</button>' +
            '<button type="button" class="abtn primary" data-act="prompt" data-id="' + it._id + '">📋 AI prompt</button>' +
          '</div>' +
        '</div></div>';
    }).join('');
  }

  // ─── Clone: duplicate into the right local library (local-first, like /landing) ──
  function cloneItem(it) {
    const r = it.raw || {};
    if (it.kind === 'landing') {
      const ch = r.channel === 'mailer' ? 'mailers' : (r.channel || 'mailers');
      const k = LP_KEY(ch), list = JSON.parse(localStorage.getItem(k) || '[]');
      list.unshift({ ...r, channel: ch, hero: (r.hero || it.name || 'Untitled') + ' (Copy)', created_at: now() });
      localStorage.setItem(k, JSON.stringify(list.slice(0, 50)));
    } else if (it.kind === 'ad') {
      const s = JSON.parse(LCStore.get('knickgasm-ads-v1') || '{}'); const ch = r.channel || 'meta';
      s[ch] = s[ch] || [];
      s[ch].unshift({ ...r, name: (it.name || 'Ad') + ' (Copy)', image: it.image || '', id: Date.now().toString(36), market: r.market || it.market || '' });
      LCStore.set('knickgasm-ads-v1', JSON.stringify(s));
    } else {
      const logs = JSON.parse(localStorage.getItem(LOGS_KEY()) || '[]');
      logs.unshift({ id: Date.now(), date: now(), prompt: r.brief || it.name || '', type: r.type || '', markets: [r.market || it.market || ''],
        _full: { campaign_title: (r.campaign_title || it.name || 'Mailer') + ' (Copy)', primary_market: r.market || it.market || '' } });
      localStorage.setItem(LOGS_KEY(), JSON.stringify(logs.slice(0, 100)));
    }
  }

  // Event delegation for asset actions.
  $('#grid').addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    const it = byId[btn.dataset.id]; if (!it) return;
    if (btn.dataset.act === 'view') {
      // Open the real rendered document in a new tab via a Blob URL (no srcdoc size
      // limit, exactly what ships). Falls back to the product image if no HTML.
      if (it.html) {
        const url = URL.createObjectURL(new Blob([it.html], { type: 'text/html' }));
        window.open(url, '_blank', 'noopener');
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      } else if (it.image) { window.open(it.image, '_blank', 'noopener'); }
      return;
    }
    if (btn.dataset.act === 'prompt') { copyText(buildPrompt(it), '📋 AI prompt copied — paste into Claude, Gemini or ChatGPT.'); return; }
    if (btn.dataset.act === 'clone') {
      try { cloneItem(it); } catch (err) { toast('Clone failed. ' + window.LifecycleFailure.sentence(err)); return; }
      toast('⧉ Cloned "' + (it.name || 'asset') + '" — reloading library…');
      await buildAll(); render();
    }
  });

  // Controls
  document.querySelectorAll('[data-type]').forEach((c) => c.addEventListener('click', () => {
    document.querySelectorAll('[data-type]').forEach((x) => x.classList.toggle('active', x === c));
    TYPE = c.dataset.type; render();
  }));
  document.querySelectorAll('[data-scope]').forEach((c) => c.addEventListener('click', async () => {
    document.querySelectorAll('[data-scope]').forEach((x) => x.classList.toggle('active', x === c));
    SCOPE = c.dataset.scope; await buildAll(); render();
  }));
  $('#q').addEventListener('input', (e) => { Q = e.target.value || ''; render(); });
  // The count makes the refresh verifiable. "Refreshed" alone is indistinguishable
  // from a refresh that silently read nothing.
  $('#refresh').addEventListener('click', async () => {
    await buildAll(); render();
    toast('Refreshed: ' + ITEMS.length + ' asset' + (ITEMS.length === 1 ? '' : 's')
      + (usingLocal ? ' (this browser only, the shared database could not be read)' : ''));
  });

  // Shared-source-of-truth freshness (spec §24b): surface the sync engine's
  // per-campaign freshness so the reviewer can see when a shipped asset is stale
  // against its canonical source. Additive + fail-quiet — never blocks the grid.
  async function loadSync() {
    const strip = $('#syncStrip'); if (!strip) return;
    try {
      const r = await fetch('/api/calendar?action=smart-brain-sync-status').then((x) => x.json()).catch(() => null);
      if (!r || !r.ok || !r.connected) { strip.hidden = true; return; }
      const total = r.count || 0, stale = r.stale || 0;
      if (!total) { strip.hidden = true; return; }
      const dot = stale > 0 ? '#d9b25a' : '#3fa46a';
      const label = stale > 0
        ? ('<b style="color:#111111">' + stale + ' of ' + total + '</b> generated campaign' + (total === 1 ? '' : 's') + ' need regeneration — a source fact changed since they were built'
           + ' <span style="color:var(--brand-accent-text)">(STALE)</span>')
        : ('<b style="color:#111111">' + total + '</b> generated campaign' + (total === 1 ? '' : 's') + ' tracked, all current against source');
      strip.innerHTML = '<span style="width:9px;height:9px;border-radius:50%;background:' + dot + ';display:inline-block;flex:0 0 auto"></span>'
        + '<span>Source sync · ' + label + '</span>'
        + '<span style="margin-left:auto;color:#8a8a8a;font-size:11px">one canonical record, many views</span>';
      strip.style.display = 'flex'; strip.hidden = false;
    } catch (_) { strip.hidden = true; }
  }

  async function load() {
    $('#grid').innerHTML = '<div class="empty">Loading…</div>';
    await buildAll(); render();
    $('#srcline').innerHTML = usingLocal
      ? 'Some assets are read from <b>this browser only</b> (the shared DB table may be empty or not migrated yet). Clones are always saved locally first.'
      : 'Reading from the <b>shared database</b> (+ this browser).' + (myEmail() ? '' : ' Sign in to filter to just your assets.');
    loadSync();
  }
  // The prompt builder, reachable for a test of what the "AI prompt" button copies.
  window.AssetLibrary = { buildPrompt };
  load();
})();
</script>
</body>
</html>
