<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lifecycle OS</title>
<style>
  html,body{margin:0;height:100%;background:#0a1410;color:#FFFFFF;font-family:-apple-system,system-ui,Roboto,Arial,sans-serif}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
  .mark{color:#6A33D8;letter-spacing:.22em;text-transform:uppercase;font-size:12px;font-weight:800}
  h1{font-family:Georgia,serif;font-size:26px;margin:0}
  .sp{width:34px;height:34px;border:3px solid rgba(171,135,67,.25);border-top-color:#6A33D8;border-radius:50%;animation:s 0.9s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  a{color:#8fe7b9}
  .off{display:none;font-size:14px;color:#a7b5ad;max-width:280px;line-height:1.5}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">KNICKGASM</div>
    <h1>Lifecycle OS</h1>
    <div class="sp" id="sp"></div>
    <p class="off" id="off">You appear to be offline. Reconnect to load the Lifecycle OS, then reopen the app.<br><br><a href="https://knickgasm.vercel.app">Open in browser</a></p>
  </div>
  <script>
    // The native shell loads the live app via capacitor.config server.url.
    // This screen is the brief splash / offline fallback only.
    setTimeout(function(){
      if (!navigator.onLine) { document.getElementById('sp').style.display='none'; document.getElementById('off').style.display='block'; }
    }, 2500);
  </script>
</body>
</html>
