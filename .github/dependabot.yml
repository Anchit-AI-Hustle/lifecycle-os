version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    ignore:
      # The browser loads pdf.js from the CDN at the version brand-document.js
      # names; the npm copy only lets the tests serve those same bytes. A major
      # bump of the npm copy alone tests a reader nobody ships (6.x failed five
      # brand-guide tests, 2026-10-18): upgrade both together, by hand.
      - dependency-name: "pdfjs-dist"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
