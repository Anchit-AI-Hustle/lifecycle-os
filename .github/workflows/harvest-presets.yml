# Harvest the starter brands from their OWN rendered sites.
#
# WHY A WORKFLOW. The /onboarding gallery's starter brands must carry the
# colours and type each brand's own site renders (the preset provenance rule
# in CLAUDE.md). Reading them needs a real browser and the public internet;
# the agent containers that edit this repo have neither egress nor the right
# to fake it. GitHub's runners have both.
#
# WHAT IT RUNS. scripts/harvest-presets.js, which reads each preset's
# `website` through the platform's ONE rendered reader
# (api/_shared/brand-render.js `readSite`), then `npm run brand:presets`
# regenerates data/brands/presets/ and the brand gates run. A site that blocks
# an automated read stays on the neutral default and says so; nothing here
# tries to get past a bot wall.
#
# TWO MODES, and only one of them writes (2026-10-04).
#   pull_request       READ AND REPORT. A same-repository PR that touches the
#                      harvester, the mapping, the builder, the reader or this
#                      file is proven by reading every site through it: the
#                      before/after table goes to the run summary, screenshots
#                      and reports to the artifact. Nothing is committed. It
#                      fails only when a gate does: the reader cannot run, no
#                      site renders at all, or the regenerated presets break
#                      brand:check / test:isolation / the preset specs.
#                      It used to commit 40 brands' data back onto the PR - so
#                      every PR that touched the reader (#131 got 5c06501)
#                      carried a data commit its author never asked for, and
#                      that bot push produced `action_required` runs.
#   workflow_dispatch  READ, THEN PUBLISH - from the default branch only. The
#                      regenerated data is committed onto a branch of its own,
#                      `claude/harvest-presets-<run id>` (no Vercel preview:
#                      vercel.json deploymentEnabled), and a PR is opened for
#                      it. Never onto an existing branch. Dispatched on any
#                      other branch it reads and reports, and says why it did
#                      not publish.
#
# THE BOT'S COMMIT CARRIES [skip ci]. GitHub then starts no push or
# pull_request run for it - no `action_required` entries on the commit - and
# the data PR waits, unmerged, for a human: auto-merge.yml fires only when CI
# completes, and CI starts on the next commit a person pushes (an empty one is
# enough). A human's commit does not carry the marker, so real CI is never
# skipped - unless its message QUOTES it: GitHub matches the marker anywhere in
# the head commit's message, body included. This change's own first commit
# described the marker in its body and started no CI, no SiS guard and no
# read. Write "the skip-ci marker" in prose. `[skip harvest]` on a PR head
# still skips the read.
#
# LEAST PRIVILEGE. The read job is read-only. The publish job alone holds
# `contents: write` (its own branch), `pull-requests: write` (its own PR) and
# `actions: read` (this run's artifact), and runs only for a dispatch.
name: Harvest preset brands (rendered)

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Comma-separated preset slugs to read (empty = every preset)'
        required: false
        default: ''
  pull_request:
    paths:
      - scripts/harvest-presets.js
      - scripts/lib/preset-observation.js
      - scripts/build-brand-presets.js
      - api/_shared/brand-render.js
      - api/_shared/render-*.js
      - .github/workflows/harvest-presets.yml

permissions:
  contents: read

concurrency:
  group: harvest-presets-${{ github.head_ref || github.ref_name }}
  # Queued, not cancelled: a later push must not kill a read that is half way
  # through forty sites.
  cancel-in-progress: false

jobs:
  harvest:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      SLUGS: ${{ github.event.inputs.slugs || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR's own head (not the merge ref), so `[skip harvest]` reads
          # the commit its author wrote.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Skip when the head commit asks to
        id: gate
        run: |
          msg="$(git log -1 --format=%B)"
          if [ "${{ github.event_name }}" = "pull_request" ] && printf '%s' "$msg" | grep -qF '[skip harvest]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Head commit carries [skip harvest]; nothing read." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.skip != 'true'
        with: { node-version: 22, cache: npm }

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Install Chromium for the reader
        if: steps.gate.outputs.skip != 'true'
        run: |
          npx playwright install --with-deps chromium
          echo "BRAND_RENDER_CHROMIUM=$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Keep the gallery as it was, for the before/after table
        if: steps.gate.outputs.skip != 'true'
        run: cp data/brands/presets/index.json "$RUNNER_TEMP/index.before.json"

      - name: Read each brand's own site
        if: steps.gate.outputs.skip != 'true'
        run: |
          node scripts/harvest-presets.js \
            --slugs "$SLUGS" \
            --artifacts harvest-artifacts \
            --concurrency 3 \
            --deadline-ms 110000 \
            --max-pages 2

      - name: Regenerate the presets from what was read
        if: steps.gate.outputs.skip != 'true'
        run: npm run brand:presets

      - name: The gates the presets have to pass
        if: steps.gate.outputs.skip != 'true'
        run: |
          npm run brand:check
          npm run build
          npm run test:isolation
          npx playwright test tests/brand-presets.spec.js tests/preset-harvest.spec.js --project=desktop-1280 --reporter=line

      - name: Before / after
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p harvest-artifacts
          {
            echo "## Starter brands, read from their own rendered sites"
            echo
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Read and report only: nothing from this run is committed. A dispatch from the default branch publishes on a branch of its own."
              echo
            fi
            node scripts/harvest-presets.js --report-before "$RUNNER_TEMP/index.before.json"
          } | tee harvest-artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Screenshots and per-brand reports
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: preset-harvest-${{ github.run_id }}
          path: harvest-artifacts/
          retention-days: 14
          if-no-files-found: warn

      - name: The regenerated data, for the publish job
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: preset-data-${{ github.run_id }}
          path: |
            data/brands/observed
            data/brands/presets
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: harvest
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit that was read, so the data lands on exactly that tree.
          ref: ${{ github.sha }}

      - name: Fetch the data the read job regenerated
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          DL: ${{ runner.temp }}/preset-data
        # Both uploaded paths share data/brands, so the artifact's root is
        # that folder: observed/ and presets/. `gh run download` refuses to
        # overwrite a file that exists (found by the first real dispatch:
        # "open .../adidas.observed.json: file exists"), so it downloads
        # beside the tree, and the two folders are then replaced WHOLE - the
        # tree is exactly what the read job produced.
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$REPO" --name "preset-data-$RUN_ID" --dir "$DL"
          test -f "$DL/presets/index.json" || { echo "The artifact holds no presets/index.json." >&2; exit 1; }
          test -d "$DL/observed" || { echo "The artifact holds no observed/ folder." >&2; exit 1; }
          rm -rf data/brands/observed data/brands/presets
          cp -R "$DL/observed" data/brands/observed
          cp -R "$DL/presets" data/brands/presets

      - name: Publish on a branch of its own
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          REF: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # A pull_request never reaches this job (the job `if`); refused here
          # too, so the rule does not rest on one line of YAML.
          if [ "$EVENT" != "workflow_dispatch" ]; then
            echo "Only a dispatched harvest publishes; this was $EVENT. Nothing committed."
            exit 0
          fi
          if [ "$REF" != "$BASE" ]; then
            echo "::notice::Dispatched on $REF, not $BASE: read and reported only. Nothing is committed onto an existing branch; the data is in this run's preset-data artifact."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only the harvested data, whatever else the tree holds.
          git add -- data/brands/observed data/brands/presets
          if git diff --cached --quiet; then
            echo "Nothing changed: every preset already carries this read."
            exit 0
          fi
          branch="claude/harvest-presets-$RUN_ID"
          today="$(date -u +%Y-%m-%d)"
          git commit -q -m "Starter brands read from their own rendered sites ($today) [skip ci]" \
            -m "Written by .github/workflows/harvest-presets.yml run $RUN_ID through api/_shared/brand-render.js readSite. Blocked, timed-out and unavailable reads keep the neutral default and record why. [skip ci]: no run starts for this commit; CI starts on the next commit a person pushes."
          git push origin "HEAD:refs/heads/$branch"
          url="$(gh api -X POST "repos/$REPO/pulls" \
            -f title="Starter brands read from their own rendered sites ($today)" \
            -f head="$branch" \
            -f base="$BASE" \
            -f body="Regenerated by the harvest-presets workflow, run $RUN_ID. The per-brand before/after table is in that run's summary; screenshots and per-brand reports are in its preset-harvest artifact.

          The data commit carries [skip ci], so no CI has run on this PR and auto-merge cannot land it. Review the table, then push any commit to this branch (an empty one is enough) to start CI." \
            --jq .html_url)"
          echo "Opened $url"
          echo "Published on \`$branch\`: $url" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
