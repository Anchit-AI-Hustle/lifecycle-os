name: Daily Intelligence Sync (noon IST + manual)

# The full daily loop = pull READ-ONLY data from the source platforms into
# Supabase, re-analyse, re-plan the calendar, and regenerate the day's campaign
# assets (mailers / ads / landing pages). It hits the CRON_SECRET-protected
# endpoint POST /api/brain?action=cron.
#
# WHY GitHub Actions: Vercel Hobby cron jobs can only run ONCE per day, so the
# native Vercel cron covers the MIDNIGHT IST run (vercel.json: "30 18 * * *").
# This workflow adds the SECOND daily run at NOON IST, plus a manual "Run now"
# button (workflow_dispatch) for on-demand/one-time runs.
#
# SETUP (one-time): add two repo secrets under Settings -> Secrets and variables
# -> Actions:
#   CRON_SECRET   = the same value as the Vercel CRON_SECRET env var
#   APP_BASE_URL  = https://lifecycle-os.anchit-tandon.com   (optional;
#                   falls back to that default below if unset)

on:
  workflow_dispatch: {}            # manual "Run now" for the one-time run
  schedule:
    - cron: '30 6 * * *'           # 06:30 UTC = 12:00 noon IST

concurrency:
  group: daily-intelligence-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the daily loop (read-only pull -> analyse -> re-plan -> regenerate)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          BASE="${APP_BASE_URL:-https://lifecycle-os.anchit-tandon.com}"
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret is not set — add it under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi
          # One call per phase (2026-10-13): runs #71-#73 sent every step in
          # ONE request, which passed the function's 120 s limit and died with
          # FUNCTION_INVOCATION_TIMEOUT. Each phase fits; a phase that ran out
          # of time says which steps it skipped, and is called once more.
          fail=0
          for phase in data plan refresh; do
            for attempt in 1 2; do
              out="$(curl --fail-with-body -sS --max-time 130 -X POST \
                "$BASE/api/brain?action=cron&phase=$phase" \
                -H "Authorization: Bearer $CRON_SECRET" \
                -H "Content-Type: application/json")" || { echo "::error::phase $phase: $out"; fail=1; break; }
              echo "phase $phase (attempt $attempt): $(jq -c '{complete, skipped, ms, errors: [(.steps // {}) | to_entries[] | select(.value.error) | .key]}' <<<"$out" 2>/dev/null || echo "$out")"
              # complete:false = steps skipped for time; partial:true = the run's
              # time budget answered for it (time-budget.js). Either: call again.
              if [ "$(jq -r 'if (.complete == false or .partial == true) then "again" else "done" end' <<<"$out" 2>/dev/null)" != "again" ]; then break; fi
              [ "$attempt" = 2 ] && echo "::warning::phase $phase still skipped steps after a second call: $(jq -c '.skipped' <<<"$out")"
            done
          done
          exit $fail
