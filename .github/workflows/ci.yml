name: CI
on:
  push: { branches: [main] }
  pull_request: {}
# Least-privilege token: these jobs only read the checked-out repo.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: HTML smoke test
        run: |
          test -f lifecycle_mailer_architect_v34.html
          node -e "const fs=require('fs');const s=fs.readFileSync('lifecycle_mailer_architect_v34.html','utf8');if(!s.includes('<!DOCTYPE html>'))process.exit(1);console.log('v34 OK ('+s.length+' bytes)')"
      - name: JS syntax check (api / lib / workers / scripts + shared shells)
        run: |
          set -e
          for f in $(find api lib workers scripts -name '*.js'); do node --check "$f"; done
          for f in auth.js sw.js chart-enhance.js table-sort.js; do [ -f "$f" ] && node --check "$f"; done
          echo "All JS parses cleanly"
      - name: Function-count guard (Hobby cap = 12)
        # Vercel counts every non-_shared file under api/ as a Serverless Function.
        # The vercel.json "functions" map is OPTIONAL per-function config, so a file
        # need not appear there — the only hard limit is the count (12 on Hobby).
        run: |
          node -e "const cp=require('child_process');const files=cp.execSync(\"find api -name '*.js' -not -path '*/_shared/*'\").toString().trim().split('\n').filter(Boolean);if(files.length>12){console.error('FAIL: '+files.length+' function files exceeds Hobby cap of 12:\n  '+files.join('\n  '));process.exit(1);}console.log('OK: '+files.length+'/12 Serverless Function files (Hobby cap = 12)');"
      - name: Brand truth in sync
        # data/brands/_default.json is the single source of brand truth; the
        # theme.css tokens, CLAUDE.md constants and Supabase brand-kit seed are
        # generated from it. Fail rather than let a hand-edit drift them apart.
        run: npm run brand:check
      - name: No foreign brand names or numbers
        # Logic is ported between the sibling lifecycle-OS repos built for other
        # companies. A foreign brand token or P&L figure riding along in a
        # comment, preset or sample payload is invisible until a customer sees
        # another company's revenue on their own dashboard.
        run: npm run check:foreign:ci

      - name: Skills resolve the ACTIVE brand
        # The app went multi-tenant; .claude/commands/ did not follow. A skill
        # is a prompt - a hardcoded brand there writes another company's product
        # into this company's campaign just as surely as a hardcoded page string.
        run: npm run check:skills:ci

      - name: A test executes the logic it guards
        # A source-text assertion proves a string is present, not that the code
        # behaves. Both tests guarding the unauthenticated-LLM-proxy finding were
        # source assertions, and both still passed when the gate's refusal was
        # discarded — putting the open proxy back. Some claims genuinely are about
        # a file (a secret must not appear in shipped output), so this does not
        # forbid them: it holds the count per file and fails when one RISES.
        run: npm run check:executed:ci

      - name: DESIGN.md conforms to the open spec
        # DESIGN.md is google-labs-code/design.md, an existing Apache-2.0 format
        # with its own linter. Our tests can only check the shape we THINK the
        # spec has; this checks the shape it actually has, using the spec's own
        # tool - including its WCAG contrast rule. Skips (exit 0) when the CDN
        # is unreachable: a network failure is not a format failure.
        run: npm run check:designmd:ci

      - name: Every element and word of every page
        # 65 pages, ~240k words. Blocks wrong-industry vocabulary, fabricated
        # proof, banned phrases used as copy, dead links and off-brand colour.
        run: npm run audit:pages:ci
      - name: Every filter and CTA is actually wired
        # Resolves every inline handler, DOM lookup, control and animation on
        # every page. Catches the silent class of bug where a button renders,
        # clicks, and does nothing because the function behind it was renamed.
        run: npm run audit:interactions:ci

      - name: Build catalog
        run: npm run build

      - name: Brand isolation (no cross-brand content in generated assets)
        run: npm run test:isolation

  e2e:
    name: Visual + invariant tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Build catalog
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright suite
        run: npx playwright test --reporter=list
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/report/
          retention-days: 7
