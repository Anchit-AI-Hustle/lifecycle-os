# The scheduler calls the project's own vercel.app address, not the custom
# domain: Cloudflare in front of lifecycle-os.anchit-tandon.com answers
# GitHub's runners with a 403 bot challenge. vercel.json lets /api/ through
# on that address (pages still redirect). SCHEDULER_BASE_URL overrides it.
name: Hourly Data Analysis & Anomaly Alerts

# Runs the unified Data Analysis control plane once per hour. The persisted
# alert settings can reduce the effective cadence to 2/4/6/12/24 hours without
# changing this workflow; the API returns a clean cadence_not_due response.
#
# Required GitHub Actions secrets:
#   CRON_SECRET  — same value as the Vercel CRON_SECRET environment variable
#   SCHEDULER_BASE_URL (optional) — defaults to https://lifecycle-os-anchit-ai-hustle.vercel.app

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore the saved cadence and run now'
        type: boolean
        default: true
  schedule:
    - cron: '7 * * * *'

concurrency:
  group: hourly-data-analysis
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SCHEDULER_BASE_URL: ${{ secrets.SCHEDULER_BASE_URL }}
    steps:
      - name: Run source-backed analysis and anomaly delivery
        shell: bash
        run: |
          set -euo pipefail
          BASE="${SCHEDULER_BASE_URL:-https://lifecycle-os-anchit-ai-hustle.vercel.app}"
          BASE="${BASE%/}"
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET repo secret is not set." >&2
            exit 1
          fi

          FORCE=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            FORCE=true
          fi

          curl --fail-with-body --retry 2 --retry-delay 5 -sS \
            -X POST "$BASE/api/public-config?action=data-analysis" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"op\":\"run-hourly\",\"force\":$FORCE}"
