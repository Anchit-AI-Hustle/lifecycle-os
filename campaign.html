<!DOCTYPE html>
<html lang="en">
<head>
<!-- brand-context FIRST: installs the workspace-scoping fetch wrapper before any page script issues an /api/ call -->
<script src="/brand-context.js?early=1"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Campaign | KNICKGASM</title>
  <!-- Load Supabase Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="margin: 0; padding: 0; background: #FFFFFF;">
  <div id="loader" style="font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 100px 24px; color: #D0473E;">
    <div style="font-size: 24px; font-weight: 600; margin-bottom: 8px; letter-spacing: 0.05em;">KNICKGASM</div>
    <div style="font-size: 14px; color: #6A33D8;">Retrieving campaign variant...</div>
  </div>

  <script>
    /* A FAILURE IS NOT CONTENT, and it is not a colour this page invented.
       Declared locally because this loader carries no shared shell - it
       document.write()s the campaign over itself, so auth.js (and with it the
       shared LifecycleFailure treatment + theme.css) cannot live here. Same
       markup, same three rules: a frame, a sentence rather than a bare machine
       identifier, and the identifier kept beside it and labelled. Colours come
       from the brand tokens brand-context.js paints on <html>; with no token
       the text simply inherits, which is readable, rather than falling back to
       a literal this page chose for every tenant. Built with textContent, so a
       server string can never arrive as markup. */
    function showFailure(loader, title, err) {
      const raw = String((err && err.message) || err || '').trim();
      const code = /^[a-z][a-z0-9]*(?:[_.\-][a-z0-9]+)+$/.test(raw) ? raw : '';
      const msg = (!raw || code)
        ? 'The server refused this request and did not explain why.'
        : (/failed to fetch|networkerror/i.test(raw)
            ? 'The server could not be reached, so nothing could be loaded.'
            : raw);
      loader.textContent = '';
      const box = document.createElement('div');
      box.setAttribute('role', 'alert');
      box.dataset.failure = '1';
      box.style.cssText = 'max-width:520px;margin:0 auto;padding:14px 16px;text-align:left;'
        + 'border:1px solid var(--brand-line);border-left:4px solid var(--brand-err);border-radius:8px;'
        + 'background:var(--brand-surface-alt);color:var(--brand-ink)';
      const tag = document.createElement('span');
      tag.style.cssText = 'display:block;margin-bottom:5px;font-size:11px;font-weight:800;'
        + 'letter-spacing:.12em;text-transform:uppercase;color:var(--brand-err)';
      tag.textContent = title;
      const line = document.createElement('span');
      line.style.cssText = 'display:block;font-size:14px;line-height:1.5';
      line.textContent = msg;
      box.appendChild(tag); box.appendChild(line);
      if (code) {
        const c = document.createElement('span');
        c.style.cssText = 'display:block;margin-top:7px;font:11px/1.4 ui-monospace,Menlo,monospace;color:var(--brand-ink-muted)';
        c.textContent = 'Reported by the server as: ' + code;
        box.appendChild(c);
      }
      loader.appendChild(box);
    }

    async function init() {
      const loader = document.getElementById('loader');

      // 1. Extract query parameters
      const urlParams = new URLSearchParams(window.location.search);
      const theme = urlParams.get('theme');
      const variant = urlParams.get('variant');

      if (!theme || !variant) {
        showFailure(loader, 'Nothing was requested',
          'The URL must include theme and variant, for example ?theme=mother-day&variant=A.');
        return;
      }

      try {
        // 2. Fetch public Supabase configuration
        const configRes = await fetch('/api/public-config');
        if (!configRes.ok) throw new Error('Failed to fetch public config');
        const config = await configRes.json();

        const supabaseUrl = config.supabase.url;
        const supabaseAnonKey = config.supabase.anonKey;

        if (!supabaseUrl || !supabaseAnonKey) {
          loader.innerHTML = `
            <div style="font-size: 20px; font-weight: 600; color: #cc3333; margin-bottom: 8px;">Configuration Error</div>
            <div style="font-size: 14px; color: #666;">Supabase keys are missing in public-config. Ensure environment variables are loaded.</div>
          `;
          return;
        }

        // 3. Initialize Supabase
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

        // 4. Fetch the raw HTML campaign variant based on slugs
        const { data: campaign, error } = await supabaseClient
          .from('campaign_variants')
          .select('html_content, themes!inner(theme_name)')
          .eq('themes.theme_name', theme)
          .eq('variant_type', variant.toUpperCase())
          .maybeSingle();

        if (error) {
          console.error(error);
          showFailure(loader, 'The campaign could not be read', error);
          return;
        }

        if (!campaign || !campaign.html_content) {
          showFailure(loader, 'No such campaign variant',
            'No variant matches ' + theme + ' (' + variant.toUpperCase() + ').');
          return;
        }

        // 5. Replace entire document with the raw campaign HTML
        document.open();
        document.write(campaign.html_content);
        document.close();

      } catch (err) {
        console.error(err);
        showFailure(loader, 'The campaign could not be loaded', err);
      }
    }

    init();
  </script>
</body>
</html>
