<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lifecycle OS</title>
<!-- The native shell (Android and iOS). Capacitor loads the live app from
     capacitor.config.json server.url, so the apps always run what the website
     runs; this page is only the brief launch / offline screen. It is PLATFORM
     chrome: the Lifecycle OS mark on a plain surface, never a tenant's name or
     colour (rendered by scripts/build-platform-mark.js, gated by
     tests/platform-identity.spec.js). -->
<style>
  html,body{margin:0;height:100%;background:#FFFFFF;color:#24292E;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  .wrap{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:24px max(24px,env(safe-area-inset-right)) 24px max(24px,env(safe-area-inset-left))}
  .sp{width:28px;height:28px;border:3px solid #D4D8DE;border-top-color:#24292E;border-radius:50%;animation:s .9s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.sp{animation:none}}
  .off{display:none;font-size:16px;line-height:1.5;max-width:300px;margin:0}
  a{color:#24292E;font-weight:700}
</style>
</head>
<body>
  <div class="wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 168" width="200" height="140" role="img" aria-label="Lifecycle OS"><title>Lifecycle OS</title><g transform="translate(72 4) scale(1.5)"><rect id="tile" x="1" y="1" width="62" height="62" rx="15" fill="#F5F6F8" stroke="#D4D8DE" stroke-width="2"/><g id="glyph">
    <path d="M 36.4 15.58 A 17 17 0 1 1 18.07 22.25" fill="none" stroke="#24292E" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 22.09 16.52 L 22.82 26.8 L 12.18 19.34 Z" fill="#24292E"/>
    <circle cx="32" cy="32" r="4.5" fill="#24292E"/>
  </g></g><text x="120" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#24292E" textLength="204" lengthAdjust="spacingAndGlyphs" text-anchor="middle">Lifecycle OS</text></svg>
    <div class="sp" id="sp" role="status" aria-label="Loading"></div>
    <p class="off" id="off">You appear to be offline. Reconnect, then reopen the app.<br><br><a href="https://lifecycle-os.anchit-tandon.com">Open in the browser</a></p>
  </div>
  <script>
    setTimeout(function(){
      if (!navigator.onLine) { document.getElementById('sp').style.display='none'; document.getElementById('off').style.display='block'; }
    }, 2500);
  </script>
</body>
</html>
