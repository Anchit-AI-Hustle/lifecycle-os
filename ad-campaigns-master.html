<!--
  This page used to BE the "Ad Campaigns Master Dashboard": eleven tabs of one
  advertiser's real paid programme, fetched from four committed JSON files under
  data/ads/.

  None of it belonged to this product, or to any brand signed into it. The repo
  was copied from a sibling lifecycle-OS project built for a different company
  and rebranded by search-and-replace, so the brand NAME was rewritten while the
  business underneath it was not. The tabs carried that company's ad-account
  register (nineteen warehouse feeds with real platform account ids and lifetime
  spend), eighty-six days of real daily spend, thirty-seven named campaigns with
  revenue and ROAS, a hundred and twenty-five ad rows naming individual creators
  by their social handles, its retail-media funnel, its internal handover email
  threads with named employees, and its launch runbooks. A brand that onboarded
  here opened this page and read all of it under its own name.

  There is no per-workspace version of that page to rebuild. Eight of the eleven
  tabs were a knowledge base of somebody's handover, and there is no such record
  for a workspace that has just signed up; inventing one would be fabrication in
  the other direction, and a plausible-looking invention is worse than an empty
  state because it reads as real. The three tabs that did measure something -
  Live Now, Calendar, Tracker - duplicated Paid Media, which already reads the ad
  accounts the WORKSPACE connected and already shows an honest empty state naming
  what to connect.

  So the data is deleted and this URL redirects to the surface that owns the
  analysis. The file stays because it shipped as a URL, and a URL that once
  worked is redirected, never dropped.
-->
<div>
  <p>The Ad Campaigns Master Dashboard has been retired.</p>
  <p>Paid media now lives on <a href="/data-analysis?tab=live-ads">Data Analysis &rsaquo; Paid Media</a>, which reads the ad accounts <em>your</em> workspace connected.</p>
  <p>Connect an ad account under <a href="/connections">Connections</a>.</p>
</div>
</body>
