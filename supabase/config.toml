# Supabase CLI config for Lifecycle OS. `supabase link --project-ref <project-ref>`
# ties this directory to the hosted project; `npm run db:push` applies
# supabase/migrations/ to it; `supabase config push` applies the [auth]
# settings below. Runbook: docs/mobile-pin-signin.md ("Supabase mode").

project_id = "lifecycle-os"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
# The production URL is canonical for every environment's Google redirect.
site_url = "https://lifecycle-os.anchit-tandon.com"
# Google is the sign-in (2026-10-05). redirectTo is always this canonical root.
# A hosted project that does not list these, or whose Google provider is OFF,
# answers 400 validation_failed on /auth/v1/authorize.
additional_redirect_urls = [
  "http://localhost:3001",
  "http://localhost:3001/**",
  "https://lifecycle-os.anchit-tandon.com",
  "https://lifecycle-os.anchit-tandon.com/**",
  "https://lifecycle-os-*.vercel.app/**",
]
jwt_expiry = 3600
# PUBLIC email/password sign-ups stay OFF. Google accounts are created by the
# provider (below), not by POST /auth/v1/signup. The hosted project's own
# dashboard still has to have Google ON or GoTrue answers
# "Unsupported provider: provider is not enabled".
enable_signup = false

# Google OAuth. Secrets come from the environment so they are never committed.
# `supabase config push` is what turns the hosted provider on; this file alone
# does not. Client ID + secret are minted in Google Cloud Console as a Web
# application; the only Authorized redirect URI GoTrue uses is
# https://<project-ref>.supabase.co/auth/v1/callback.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

# Phone sign-in (2026-10-03): the PHONE PROVIDER must be on for the password
# grant with a phone number (POST /auth/v1/token?grant_type=password, body
# {phone, password}) - "Enabling phone and password-based authentication",
# https://supabase.com/docs/guides/auth/passwords - and that page names this
# key for config files. No SMS is sent: the server creates each user with
# phone_confirm=true, so confirmations stay off and no SMS provider is needed.
[auth.sms]
enable_signup = true
enable_confirmations = false
