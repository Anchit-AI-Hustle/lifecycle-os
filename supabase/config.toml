# Supabase CLI config for Lifecycle OS. `supabase link --project-ref <project-ref>`
# ties this directory to the hosted project; `npm run db:push` applies
# supabase/migrations/ to it; `supabase config push` applies the [auth]
# settings below. Runbook: docs/mobile-pin-signin.md ("Supabase mode").

project_id = "lifecycle-os"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "https://lifecycle-os.anchit-tandon.com"
# Sign-in is a mobile number and a 4-digit PIN only (2026-10-09). No OAuth
# provider is configured (the Google sign-in of 2026-10-05 is removed), so no
# redirect target is needed. `supabase config push` applies this file; the
# hosted dashboard's own provider switches still have to be checked by hand
# (Authentication > Sign In / Providers: Google OFF, Email OFF, Phone ON).
additional_redirect_urls = []
jwt_expiry = 3600
# PUBLIC sign-ups OFF (2026-10-03). Every account is a mobile number + PIN
# created by the server through the admin endpoint (POST /auth/v1/admin/users,
# service role), which this setting does not affect. With it on, anyone holding
# the public anon key could POST /auth/v1/signup and take a number before its
# owner does.
enable_signup = false

[auth.email]
# No email accounts: email + password is not a way in.
enable_signup = false
enable_confirmations = false
double_confirm_changes = true

# Phone sign-in (2026-10-03): the PHONE PROVIDER must be on for the password
# grant with a phone number (POST /auth/v1/token?grant_type=password, body
# {phone, password}) - "Enabling phone and password-based authentication",
# https://supabase.com/docs/guides/auth/passwords - and that page names this
# key for config files. No SMS is sent: the server creates each user with
# phone_confirm=true, so confirmations stay off and no SMS provider is needed.
[auth.sms]
enable_signup = true
enable_confirmations = false
