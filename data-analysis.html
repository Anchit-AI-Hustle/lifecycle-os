<!DOCTYPE html>
<html lang="en">
<head>
<!-- brand-context FIRST: installs the workspace-scoping fetch wrapper before any page script issues an /api/ call -->
<script src="/brand-context.js?early=1"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Analysis - Lifecycle OS</title>
<link rel="icon" href="/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  /* Palette locked to the /all-in-one dashboard (near-black-green canvas). */
  :root{
    --violet:#D0473E; --lava:#6A33D8; --ink:#111111; --chalk:#FFFFFF;
    --bg:#ffffff; --surface:#ffffff; --tile:var(--vh-panel-tan); --line:rgba(171,135,67,.18); --soft:#556059; --chip:var(--vh-panel-tan);
    --head:#111111; --accent:#6A33D8;
    /* Chart categorical palette — chosen for contrast on the dark canvas */
    --c1:#6A33D8; --c2:var(--vh-lava); --c3:#5FB487; --c4:var(--vh-lava); --c5:#8FD3B0; --c6:var(--vh-panel-tan);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,'Instrument Sans','Helvetica Neue',Arial,sans-serif;font-size:15px;line-height:1.5;}
  .wrap{max-width:1240px;margin:0 auto;padding:26px 22px 96px;}
  h1,h2,h3{font-family:'Montserrat','Raleway',Georgia,serif;color:var(--head);margin:0;text-wrap:balance;}
  h1{font-size:30px;} h2{font-size:20px;} h3{font-size:15px;}
  .eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--brand-accent-text);font-weight:700;}
  p.lede{color:var(--soft);max-width:78ch;margin:6px 0 0;}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px;}
  /* Market toggle */
  .mkt{display:inline-flex;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:4px;}
  /* A nav bar stays one row and slides. Its items must not shrink, or they
     compress into unreadable slivers instead of overflowing. */
  .mkt > *{flex:0 0 auto;white-space:nowrap}
  .mkt button{border:0;background:transparent;color:var(--soft);font-family:inherit;font-weight:700;font-size:13px;padding:7px 16px;border-radius:999px;cursor:pointer;transition:all .15s;}
  .mkt button.on{background:var(--violet);color:var(--chalk);box-shadow:0 0 0 1.5px var(--lava);}
  /* KPI tiles */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:18px 0 6px;}
  .kpi{background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:15px 16px;min-width:0;overflow:hidden;}
  .kpi .kl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);font-weight:700;}
  .kpi .kv{font-family:'Montserrat',Georgia,serif;font-size:clamp(20px,2vw,25px);color:var(--head);margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere;}
  .kpi .kd{font-size:11.5px;margin-top:6px;color:var(--soft);}
  .kpi .up{color:#3fa46a;font-weight:700;} .kpi .down{color:#c47b6b;font-weight:700;}
  /* Signals board — auto-computed "what needs attention", ranked by severity. */
  .signals{margin:16px 0 4px;}
  .sig-head{font-family:'Montserrat',Georgia,serif;font-size:17px;color:var(--head);font-weight:700;margin-bottom:10px;}
  .sig-sub{font-family:Inter,'Instrument Sans',sans-serif;font-size:11px;color:var(--soft);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-left:8px;}
  .sig-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:12px;}
  .sig{background:var(--tile);border:1px solid var(--line);border-left:3px solid var(--lava);border-radius:10px;padding:12px 14px;}
  .sig-h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--soft);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .sig-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .sig-v{font-family:'Montserrat',Georgia,serif;font-size:20px;color:var(--head);margin:5px 0 4px;font-variant-numeric:tabular-nums;line-height:1.1;}
  .sig-d{font-size:12.5px;color:var(--soft);line-height:1.45;}
  .sig-decomp{margin-top:12px;background:var(--chip);border-radius:10px;padding:11px 14px;font-size:13px;color:var(--soft);border-left:3px solid var(--lava);line-height:1.5;}
  .sig-decomp b{color:var(--head);} .sig-decomp .up{color:#3fa46a;} .sig-decomp .down{color:#c47b6b;}
  /* Widget grid */
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:16px;}
  .w{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;grid-column:span 6;display:flex;flex-direction:column;min-width:0;}
  .w.span4{grid-column:span 4;} .w.span8{grid-column:span 8;} .w.span12{grid-column:span 12;} .w.span6{grid-column:span 6;}
  @media (max-width:900px){.w,.w.span4,.w.span8,.w.span6{grid-column:span 12;}}
  @media (max-width:520px){.kpis{grid-template-columns:1fr;}.kpi .kv{font-size:22px;}}
  .w .wh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px;}
  .w .wt{font-family:'Montserrat',Georgia,serif;font-size:16px;color:var(--head);font-weight:700;}
  .w .ws{font-size:12px;color:var(--soft);}
  .w .open{font-size:11px;font-weight:700;color:var(--brand-accent-text);text-transform:uppercase;letter-spacing:.05em;background:none;border:0;cursor:pointer;padding:2px 4px;white-space:nowrap;}
  .w .open:hover{text-decoration:underline;}
  .w.link{cursor:pointer;transition:border-color .15s,box-shadow .15s;}
  .w.link:hover{border-color:var(--accent);box-shadow:0 6px 22px rgba(0,0,0,.10);}
  .wbody{margin-top:8px;flex:1;min-width:0;}
  /* charts */
  svg{display:block;max-width:100%;height:auto;overflow:visible;}
  /* time-granularity view toggle (detail drill-down) */
  .tv-toggle{display:inline-flex;gap:4px;background:var(--chip,var(--vh-panel-tan));border:1px solid var(--line);border-radius:11px;padding:4px;margin-top:14px;flex-wrap:wrap;}
  .tv-tile{border:none;background:transparent;color:var(--soft);font:inherit;font-size:12.5px;font-weight:700;padding:6px 13px;border-radius:8px;cursor:pointer;transition:background .12s,color .12s;}
  .tv-tile:hover:not(.dis):not(.on){color:var(--ink);}
  .tv-tile.on{background:#D0473E;color:#FFFFFF;}
  .tv-tile.dis{opacity:.42;cursor:not-allowed;}
  .tv-note{font-size:11.5px;color:var(--soft);margin-top:9px;line-height:1.5;}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px;font-size:12px;color:var(--soft);}
  .legend .li{display:inline-flex;align-items:center;gap:6px;}
  .legend .sw{width:11px;height:11px;border-radius:3px;display:inline-block;}
  /* tables */
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;}
  /* table-layout:auto, deliberately: theme.css defaults every table to
     table-layout:fixed, which splits the width equally and leaves a
     white-space:nowrap cell nowhere to put a value wider than its share -
     it overflows and paints over the next column. Sizing columns to their
     content is what makes nowrap safe here. */
  table{table-layout:auto;width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap;}
  th{color:var(--head);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:10.5px;background:var(--chip);position:sticky;top:0;}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  tr:last-child td{border-bottom:0;}
  /* heatmap */
  .heat{border-collapse:separate;border-spacing:3px;min-width:520px;}
  .heat td{border:0;border-radius:5px;text-align:center;font-size:11.5px;padding:8px 6px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .heat td.lbl{background:transparent;color:var(--soft);font-weight:700;text-align:left;}
  .heat th{background:transparent;color:var(--soft);font-size:10px;text-transform:none;letter-spacing:0;}
  /* insight box */
  .insight{background:var(--chip);border-radius:10px;padding:14px 16px;color:var(--soft);font-size:13.5px;margin:14px 0;border-left:3px solid var(--lava);}
  .insight b{color:var(--head);}
  /* detail view */
  #detail{display:none;}
  body.detailing #dash{display:none;}
  body.detailing #detail{display:block;}
  .crumb{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:var(--brand-accent-text);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;padding:6px 0;margin-bottom:6px;}
  .btn-dl{font-size:12px;font-weight:700;color:var(--violet);background:var(--lava);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;}
  .btn-dl:hover{filter:brightness(1.05);}
  .note{color:var(--soft);font-size:12.5px;border-top:1px solid var(--line);margin-top:26px;padding-top:14px;}
  .datalink{color:var(--head);text-decoration-color:var(--accent);}
  .bignum{font-family:'Montserrat',Georgia,serif;font-size:30px;color:var(--head);}
  .empty{color:var(--soft);text-align:center;padding:26px;font-size:13px;}
  /* A field this market does not export reads as "not measured", never as a
     zero the reader would take for a finding. */
  .kunset{font-family:Inter,'Instrument Sans',Arial,sans-serif;font-size:14px;font-weight:600;color:var(--soft);}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">Lifecycle OS - Research &amp; Benchmark</span>

  <div id="dash">
    <div class="topbar">
      <div>
        <h1>Data Analysis</h1>
        <p class="lede">The full growth analytics workbench for the active brand. Every widget drills into a detailed page with the complete data, a bigger chart, a growth read, and a CSV download. This is where all the analysis a D2C growth team needs gets done.</p>
      </div>
      <div class="mkt" id="mktToggle" role="tablist" aria-label="Market">
        <button type="button" data-mkt="US" class="on">🇺🇸 United States</button>
        <button type="button" data-mkt="UK">🇬🇧 United Kingdom</button>
        <button type="button" data-mkt="GLOBAL">🌍 Global</button>
        <button type="button" data-mkt="IN">🇮🇳 India</button>
      </div>
    </div>

    <div class="mkt" id="anTabs" role="tablist" aria-label="Analysis section" style="margin:14px 0 4px;flex-wrap:nowrap;max-width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin">
      <button type="button" data-tab="control" class="on">Control Room</button>
      <button type="button" data-tab="acq">Acquisition · Ads + LP</button>
      <button type="button" data-tab="ret">Retention · Mailer + LP</button>
      <button type="button" data-tab="cohort">Cohort &amp; Calendar</button>
    </div>

    <!-- The banner that used to sit here was a second entry point to the
         business review, which is a tab in the bar above. One door per
         analysis. -->
    <div id="growthBand"></div>
    <div class="kpis" id="kpis"></div>
    <div class="signals" id="signals"></div>
    <div class="grid" id="grid"></div>

    <p class="note" id="footnote"></p>
  </div>

  <div id="detail"></div>
</div>

<!-- The compiled market dataset describes TENANT ZERO only. It is a fact about
     one brand's business, so it must never render inside another workspace: a
     health-media or publisher brand was previously shown that brand's revenue,
     AOV and order counts as if they were its own. The guard below clears the
     global for any other brand and the page then renders its empty state. -->
<!-- The registry decides which analysis each tab owns. It loads before every
     page script because the opening-tab resolution needs it. -->
<script src="/analysis-registry.js"></script>
<script src="/data/analytics/market-data.js"></script>
<script src="/brand-catalog.js"></script>
<script>
(function () {
  // Synchronously stash and clear: the analytics IIFE below reads the global on
  // parse, so the decision has to be made before it runs. We restore it only
  // once the active brand is confirmed to be the one the dataset describes.
  var SHIPPED = window.LIFECYCLE_ANALYTICS || null;
  window.LIFECYCLE_ANALYTICS = { markets: {}, __pending: true };
  window.__ANALYTICS_OWNER__ = 'knickgasm';
  window.__restoreAnalytics = function (brand) {
    var slug = String((brand && (brand.slug || brand.name)) || '').toLowerCase();
    var isOwner = !brand || brand.is_default || slug === window.__ANALYTICS_OWNER__;
    if (isOwner && SHIPPED) { window.LIFECYCLE_ANALYTICS = SHIPPED; return true; }
    return false;
  };
})();
</script>
<script>
(function(){
  var A = (window.LIFECYCLE_ANALYTICS) || {markets:{}};
  // MKT comes from the ?mkt= URL param — remap through a literal allowlist so the
  // stored value is always a constant (never the raw, potentially-hostile input).
  // This clears the taint at the source; every use below is then a fixed string.
  var MKT = ({ US:'US', UK:'UK', GLOBAL:'GLOBAL', IN:'IN' })[(new URLSearchParams(location.search).get('mkt') || 'US').toUpperCase()] || 'US';

  // Normalise each market so a widget only appears when its data actually
  // exists (some markets export fewer datasets than others — e.g. UK ships
  // fewer CSVs than US). aov_trend is derivable from the monthly series
  // (monthly rows already carry aov), so fill it when the export omits it.
  Object.keys(A.markets).forEach(function(mk){
    var m = A.markets[mk];
    if(!m) return;
    if((!m.aov_trend || !m.aov_trend.length) && m.monthly && m.monthly.length){
      m.aov_trend = m.monthly.map(function(x){ return { month:x.month, aov:x.aov, orders:x.orders, sales:x.sales }; });
    }
  });
  // Which dataset(s) each widget needs; a widget is shown only when the current
  // market actually has that data (non-empty), so no empty/broken tiles appear.
  var WIDGET_REQ = {
    revenue:['monthly'], 'kpi-orders':['monthly'], aov:['aov_trend'], channels:['channels'],
    ptype:['product_types'], discount:['discount'], dow:['day_of_week'], newret:['new_vs_returning'],
    retrate:['returning_rate'], acq:['acquisition'], cohort:['cohort'], topprod:['top_products'],
    topqty:['top_by_qty'], weekly:['weekly'], country:['shipping_country']
  };
  function nonEmpty(v){ return Array.isArray(v) ? v.length>0 : (v && typeof v==='object' ? Object.keys(v).length>0 : !!v); }
  function widgetAvailable(w, m){
    if(w.usOnly && MKT!=='US') return false;
    if(w.ukOnly && MKT!=='UK') return false;
    var req = WIDGET_REQ[w.id]; if(!req) return true;
    return req.every(function(k){ return m && nonEmpty(m[k]); });
  }

  // ── market metadata (all four regions are first-class) ───────────────────
  var MARKET_META = {
    US:     { label:'United States', region:'us',     cur:'$', store:'www.knickgasm.com' },
    UK:     { label:'United Kingdom', region:'uk',     cur:'£', store:'knickgasm.com' },
    GLOBAL: { label:'Global',         region:'global', cur:'$', store:'knickgasm.com' },
    IN:     { label:'India',          region:'in',     cur:'₹', store:'knickgasm.com' }
  };
  function meta(mk){ return MARKET_META[mk] || { label:mk, region:String(mk||'').toLowerCase(), cur:'$', store:'' }; }
  function mktLabel(mk){ return meta(mk||MKT).label; }

  // ── formatting ──────────────────────────────────────────────────────────
  function cur(){ return meta(MKT).cur || '$'; }
  function money(v){ v=+v||0; if(Math.abs(v)>=1000000) return cur()+(v/1000000).toFixed(2)+'M'; if(Math.abs(v)>=1000) return cur()+(v/1000).toFixed(1)+'K'; return cur()+v.toFixed(0); }
  function moneyFull(v){ return cur()+(+v||0).toLocaleString(undefined,{maximumFractionDigits:2}); }
  function intf(v){ return (+v||0).toLocaleString(); }
  function pct(v){ return (v*100).toFixed(1)+'%'; }
  function mLabel(m){ if(!m) return ''; var p=String(m).split('-'); var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return (mo[(+p[1]||1)-1]||'')+" "+(p[0]||'').slice(2); }
  var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  // Attribute-safe escape (data-tip values live inside double quotes).
  function escA(s){ return esc(s).replace(/"/g,'&quot;'); }

  // ── hover tooltips: show the exact metric at the hovered point ─────────────
  // One shared floating tooltip, driven by delegated listeners on any element
  // carrying data-tip. Because it is document-level delegation it covers every
  // chart (mini + detail) and any re-render, with no per-chart wiring. The
  // tooltip never intercepts clicks (pointer-events:none), so cards stay
  // clickable. data-tip carries "Label\nValue"; rendered via textContent.
  var _daTip=null;
  function _tipEl(){
    if(_daTip) return _daTip;
    _daTip=document.createElement('div');
    _daTip.style.cssText='position:fixed;z-index:99999;pointer-events:none;background:#ffffff;color:#111111;border:1px solid #6A33D8;border-radius:7px;padding:6px 9px;font:600 11.5px/1.35 Inter,system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;transition:opacity .1s;white-space:pre;max-width:280px;';
    document.body.appendChild(_daTip);
    return _daTip;
  }
  function _tipShow(txt,x,y){ var t=_tipEl(); t.textContent=txt; t.style.opacity='1'; var w=t.offsetWidth,h=t.offsetHeight; t.style.left=Math.min(Math.max(8,x+14),window.innerWidth-w-8)+'px'; t.style.top=Math.max(8,y-h-12)+'px'; }
  function _tipHide(){ if(_daTip) _daTip.style.opacity='0'; }
  function _tipTarget(e){ return (e.target && e.target.closest) ? e.target.closest('[data-tip]') : null; }
  document.addEventListener('mouseover', function(e){ var el=_tipTarget(e); if(el) _tipShow(el.getAttribute('data-tip'),e.clientX,e.clientY); });
  document.addEventListener('mousemove', function(e){ if(!_daTip||_daTip.style.opacity==='0') return; var el=_tipTarget(e); if(el) _tipShow(el.getAttribute('data-tip'),e.clientX,e.clientY); else _tipHide(); });
  document.addEventListener('mouseout', function(e){ if(_tipTarget(e)) _tipHide(); });

  // ── tiny SVG chart kit (brand palette, high contrast on green) ────────────
  var PAL=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
  // Line chart with full labelling: Y-axis value ticks (currency / % / count),
  // a dashed mean reference line, the peak and latest points marked with values,
  // a first->last delta badge and an optional rotated Y-axis title. Every series
  // point is plotted (no sampling) so no data is hidden.
  function lineChart(pts, opts){
    opts=opts||{}; var W=opts.w||560, H=opts.h||190, pad=46, padR=54, padT=18, padB=30;
    if(!pts.length) return '<div class="empty">No data.</div>';
    var ys=pts.map(function(p){return p.y;});
    var maxY=(opts.max!=null?opts.max:Math.max.apply(null,ys)*1.14)||1, minY=(opts.min!=null?opts.min:0);
    var iw=W-pad-padR, ih=H-padT-padB;
    var fmt=function(v){ return opts.money?money(v):(opts.pct?(v.toFixed(1)+'%'):Math.round(v).toLocaleString()); };
    function X(i){ return pad + (pts.length<=1?iw/2:(i/(pts.length-1))*iw); }
    function Y(v){ return padT + ih - ((v-minY)/(maxY-minY))*ih; }
    var d=pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1);}).join(' ');
    var area=d+' L'+X(pts.length-1).toFixed(1)+' '+(padT+ih)+' L'+X(0).toFixed(1)+' '+(padT+ih)+' Z';
    var grid=''; for(var g=0;g<=4;g++){ var gy=padT+(ih*g/4); var gv=maxY-(maxY-minY)*g/4; grid+='<line x1="'+pad+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pad-6)+'" y="'+(gy+3).toFixed(1)+'" text-anchor="end" font-size="9" fill="var(--soft)">'+fmt(gv)+'</text>'; }
    // Mean reference line + label.
    var avg=ys.reduce(function(a,b){return a+b;},0)/ys.length, ay=Y(avg);
    var meanLine='<line x1="'+pad+'" y1="'+ay.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+ay.toFixed(1)+'" stroke="var(--c2)" stroke-width="1" stroke-dasharray="4 3" opacity="0.85"/><text x="'+(W-padR+3)+'" y="'+(ay+3).toFixed(1)+'" font-size="8.5" fill="var(--c2)">avg '+fmt(avg)+'</text>';
    var lbls=''; var step=Math.ceil(pts.length/8);
    pts.forEach(function(p,i){ if(i%step===0||i===pts.length-1) lbls+='<text x="'+X(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="9" fill="var(--soft)">'+esc(p.label||'')+'</text>'; });
    var dots=pts.map(function(p,i){var cx=X(i).toFixed(1),cy=Y(p.y).toFixed(1);var tip=(p.label?p.label+'\n':'')+fmt(p.y);return '<circle cx="'+cx+'" cy="'+cy+'" r="2.1" fill="var(--c1)"/><circle cx="'+cx+'" cy="'+cy+'" r="11" fill="transparent" data-tip="'+escA(tip)+'" style="cursor:pointer"/>';}).join('');
    // Peak + latest callouts (peak highlighted; latest carries its value).
    var peakI=0; ys.forEach(function(v,i){ if(v>ys[peakI]) peakI=i; });
    var lastI=pts.length-1;
    var peakDot='<circle cx="'+X(peakI).toFixed(1)+'" cy="'+Y(ys[peakI]).toFixed(1)+'" r="3.6" fill="var(--c4)"/><text x="'+X(peakI).toFixed(1)+'" y="'+(Y(ys[peakI])-7).toFixed(1)+'" text-anchor="middle" font-size="8.5" font-weight="700" fill="var(--head)">peak</text>';
    var lastDot='<circle cx="'+X(lastI).toFixed(1)+'" cy="'+Y(ys[lastI]).toFixed(1)+'" r="3.6" fill="var(--c1)"/><text x="'+X(lastI).toFixed(1)+'" y="'+(Y(ys[lastI])-7).toFixed(1)+'" text-anchor="end" font-size="9" font-weight="700" fill="var(--head)">'+fmt(ys[lastI])+'</text>';
    // First->last delta badge.

  function barChart(items, opts){
    opts=opts||{}; var W=opts.w||560, rowH=opts.rowH||26, pad=opts.labelW||150, padR=54;
    if(!items.length) return '<div class="empty">No data.</div>';
    var H=items.length*rowH+8, max=Math.max.apply(null,items.map(function(d){return d.v;}))||1, iw=W-pad-padR;
    var rows=items.map(function(d,i){
      var y=i*rowH+4, bw=Math.max(2,(d.v/max)*iw), col=PAL[i%PAL.length];
      return '<text x="'+(pad-8)+'" y="'+(y+rowH/2+3)+'" text-anchor="end" font-size="11" fill="var(--ink)">'+esc(d.label)+'</text>'+
        '<rect x="'+pad+'" y="'+(y+3)+'" width="'+bw.toFixed(1)+'" height="'+(rowH-9)+'" rx="3" fill="'+col+'" data-tip="'+escA(d.label+'\n'+(d.disp!=null?d.disp:d.v))+'" style="cursor:pointer"/>'+
        '<text x="'+(pad+bw+6)+'" y="'+(y+rowH/2+3)+'" font-size="10.5" fill="var(--soft)">'+esc(d.disp)+'</text>';

  // Stacked bars (a = new, b = returning) with a labelled count Y-axis. Bars are
  // ordered new (bottom) + returning (top); the total tick lets the reader see
  // both the mix and the absolute monthly volume.
  function stackedBars(items, opts){
    opts=opts||{}; var W=opts.w||560, H=opts.h||200, padT=16, padB=28, pad=44, padR=8;
    if(!items.length) return '<div class="empty">No data.</div>';
    var max=Math.max.apply(null,items.map(function(d){return d.a+d.b;}))*1.1||1;
    var iw=W-pad-padR, ih=H-padT-padB, bw=Math.min(30, iw/items.length*0.62), gap=iw/items.length;
    var fmt=function(v){ return Math.round(v).toLocaleString(); };
    var grid=''; for(var g=0;g<=4;g++){ var gy=padT+(ih*g/4); var gv=max-max*g/4; grid+='<line x1="'+pad+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pad-6)+'" y="'+(gy+3).toFixed(1)+'" text-anchor="end" font-size="9" fill="var(--soft)">'+fmt(gv)+'</text>'; }
    var out=items.map(function(d,i){
      var x=pad+i*gap+(gap-bw)/2, ha=(d.a/max)*ih, hb=(d.b/max)*ih;
      var yb=padT+ih-ha, ya=yb-hb;   // new (c1) sits on the axis, returning (c3) on top
      return '<rect x="'+x.toFixed(1)+'" y="'+yb.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+ha.toFixed(1)+'" fill="var(--c1)" data-tip="'+escA(d.label+'\nNew: '+fmt(d.a)+'\nTotal: '+fmt(d.a+d.b))+'" style="cursor:pointer"/>'+
             '<rect x="'+x.toFixed(1)+'" y="'+ya.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hb.toFixed(1)+'" fill="var(--c3)" data-tip="'+escA(d.label+'\nReturning: '+fmt(d.b)+'\nTotal: '+fmt(d.a+d.b))+'" style="cursor:pointer"/>'+
             (i%Math.ceil(items.length/8)===0||i===items.length-1?'<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="var(--soft)">'+esc(d.label)+'</text>':'');
    }).join('');
    var yTitle=opts.yLabel?'<text x="12" y="'+(padT+ih/2).toFixed(1)+'" transform="rotate(-90 12 '+(padT+ih/2).toFixed(1)+')" text-anchor="middle" font-size="9" fill="var(--soft)">'+esc(opts.yLabel)+'</text>':'';
    return '<svg viewBox="0 0 '+W+' '+H+'" role="img">'+grid+out+yTitle+'</svg>';
  }
  function donut(items, opts){
    opts=opts||{}; var S=opts.s||150, r=54, cx=S/2, cy=S/2, C=2*Math.PI*r;
    var total=items.reduce(function(a,d){return a+d.v;},0)||1, off=0;
    var segs=items.map(function(d,i){
      var frac=d.v/total, len=frac*C, seg='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+PAL[i%PAL.length]+'" stroke-width="20" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')" data-tip="'+escA(d.label+'\n'+money(d.v)+' ('+(frac*100).toFixed(1)+'%)')+'" style="cursor:pointer"/>';
      off+=len; return seg;
    }).join('');
    return '<svg viewBox="0 0 '+S+' '+S+'" width="'+S+'" role="img">'+segs+
      '<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="17" font-family="Montserrat,Georgia,serif" fill="var(--head)">'+money(total)+'</text>'+
      '<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" font-size="9" fill="var(--soft)">TOTAL</text></svg>';
  }

  function heatColor(v){ if(v==null) return 'var(--chip)'; var t=Math.min(1,v/35); var r=Math.round(0xE4-(0xE4-0x00)*t), g=Math.round(0xCF-(0xCF-0x4A)*t), b=Math.round(0x94-(0x94-0x2B)*t); return 'rgb('+r+','+g+','+b+')'; }
  function heatText(v){ return (v!=null && v/35>0.5)?'var(--chalk)':'var(--ink)'; }
  function table(head, rows, opts){

    return '<div class="tbl-wrap"><table>'+th+tr+'</table></div>';
  }

  // ── KPI row ────────────────────────────────────────────────────────────────
  // ── Signals board + revenue-driver decomposition ────────────────────────
  // Auto-computed "what needs attention", the analytical logic modelled on the
  // TikTok dashboard's threat board + funnel decomposition, adapted to our
  // Shopify order aggregates. Every signal is quantified from the live data and
  // severity-ranked (critical → watch → good). Guards on field availability so
  // it works on both US (full) and UK (fewer datasets) markets.
  function pctChange(a,b){ return b ? (a-b)/b : 0; }
  // Drop a trailing partial month so momentum/decomposition compare like-for-
  // like COMPLETE months. The only reliably-incomplete month is the current
  // calendar month (the export runs mid-month), so we gate on the actual date,
  // not the old "<45% of the prior month" heuristic — that heuristic could
  // mistake a genuine seasonal low for a partial month and silently hide it.
  function isCurrentMonth(monthStr){
    var parts=String(monthStr||'').split('-'); if(parts.length<2) return false;
    var y=+parts[0], mo=+parts[1]-1; if(isNaN(y)||isNaN(mo)) return false;
    var now=new Date(); return y===now.getFullYear() && mo===now.getMonth();
  }
  function fullMonths(mm){
    if(mm.length>=1 && isCurrentMonth(mm[mm.length-1].month)) return mm.slice(0,-1);
    return mm;
  }
  /**
   * Does THIS market's export actually measure the named summary field?
   *
   * A market export only carries the columns its source CSVs had, and a missing
   * column arrives here as 0, which is indistinguishable from a measured zero.
   * The UK export has no returning-customer COUNT column, so the Signals board
   * was reading its absence as a 0.0% returning rate and raising it as a
   * critical retention failure.
   *
   * The build now states the distinction outright: `summary_basis[field]` is
   * "measured" when the export carried that column and "unset" when it did not,
   * so a genuinely-measured zero (a market that really sold nothing that month)
   * still reads as a finding instead of being hidden by a >0 heuristic. The
   * value-shape fallbacks below only run for a payload built before that map
   * existed.
   */
  function measures(m, field){
    var s=(m&&m.summary)||{};
    var basis=(m&&m.summary_basis)||null;
    if(basis && basis[field]) return basis[field]==='measured';
    var v=Number(s[field]);
    if(s[field]==null) return false;
    if(field==='returning_customers' || field==='returning_rate'){
      var hasSeries = !!((m.returning_rate && m.returning_rate.length) || (m.new_vs_returning && m.new_vs_returning.length));
      return hasSeries || v>0;

    return isFinite(v) && v>0;

  function computeSignals(m){
    var sig=[], mm=m.monthly||[], fm=fullMonths(mm);
    if(fm.length>=2){ var l=fm[fm.length-1], p=fm[fm.length-2], c=pctChange(l.sales,p.sales);
      sig.push({sev:c<-0.15?'critical':(c<0?'watch':'good'), label:'Revenue momentum', value:(c>=0?'+':'')+Math.round(c*100)+'% MoM',
        detail:'Last complete month '+mLabel(l.month)+' '+moneyFull(l.sales)+' vs '+moneyFull(p.sales)+' prior. A trailing partial month is excluded so this compares like-for-like.'}); }
    var at=fullMonths(m.aov_trend&&m.aov_trend.length?m.aov_trend:mm);
    if(at.length>=2){ var f=at[0], la=at[at.length-1], c2=pctChange(la.aov,f.aov);
      sig.push({sev:c2<-0.10?'critical':(c2<-0.03?'watch':'good'), label:'AOV trend', value:(c2>=0?'+':'')+Math.round(c2*100)+'% over window',
        detail:'AOV moved from '+moneyFull(f.aov)+' to '+moneyFull(la.aov)+'. Falling AOV with rising orders is a discount-led, smaller-basket signal.'}); }
    var rr=m.summary&&m.summary.returning_rate;
    if(rr!=null && measures(m,'returning_rate')){ sig.push({sev:rr<0.25?'critical':(rr<0.35?'watch':'good'), label:'Returning-customer rate', value:pct(rr),
      detail:'Share of customers ordering more than once. Below 35% needs lifecycle flows to defend; above 45% is healthy.'}); }
    if(m.discount&&m.discount.length){ var dc=m.discount.find(function(x){return x.discounted;})||{}, fu=m.discount.find(function(x){return !x.discounted;})||{};
      var tO=(dc.orders||0)+(fu.orders||0), sh=tO?(dc.orders||0)/tO:0, gap=(fu.aov&&dc.aov)?(1-dc.aov/fu.aov):0;
      sig.push({sev:sh>0.4?'critical':(sh>0.25?'watch':'good'), label:'Discount reliance', value:pct(sh)+' of orders',
        detail:'Discounted AOV ('+moneyFull(dc.aov)+') is '+Math.round(gap*100)+'% below full price ('+moneyFull(fu.aov)+'). Reserve offers for winback and switcher cohorts.'}); }
    var tp=m.top_products||[];
    if(tp.length){ var tot=tp.reduce(function(a,b){return a+(b.net||0);},0), sh2=tot?tp[0].net/tot:0;
      sig.push({sev:sh2>0.4?'watch':'good', label:'Revenue concentration', value:pct(sh2)+' in top SKU',
        detail:trunc(tp[0].title,40)+' is '+pct(sh2)+' of top-product revenue. High concentration is a dependency risk, broaden the second-order path.'}); }
    if(m.channels&&m.channels.length){ var tc=m.channels.reduce(function(a,b){return a+b.sales;},0), cs=tc?m.channels[0].sales/tc:0;

        detail:'Revenue leans on a single channel. Diversify acquisition to de-risk the base.'}); }
    if(mm.length>=6){ var pk=mm.reduce(function(a,b){return b.sales>a.sales?b:a;},mm[0]), tr=mm.reduce(function(a,b){return b.sales<a.sales?b:a;},mm[0]);

        detail:'Peak '+mLabel(pk.month)+' at '+moneyFull(pk.sales)+', trough '+mLabel(tr.month)+' at '+moneyFull(tr.sales)+'. Lift the off-season with subscription and replenishment.'}); }

  // Revenue-driver decomposition (our analog of GMV = Impr×CTR×CVR×AOV): the
  // change in Orders×AOV between the last two months splits exactly into an
  // order-volume effect and an AOV effect.
  function revenueDecomp(m){
    var mm=fullMonths(m.monthly||[]); if(mm.length<2) return null;
    var t=mm[mm.length-1], p=mm[mm.length-2];
    // Base the split on REAL total sales, not orders*AOV. In the source data the
    // AOV column is NOT exactly sales/orders (it runs ~6-7% below), so orders*AOV
    // diverges from the actual revenue move by ~20% and contradicts the revenue
    // chart on this same page. Use an effective AOV = sales/orders so the two
    // effects sum EXACTLY to the real sales change (t.sales - p.sales).
    var dRev = (t.sales||0) - (p.sales||0);
    var aovPrev = p.orders ? (p.sales/p.orders) : 0;
    var ordersEffect = ((t.orders||0) - (p.orders||0)) * aovPrev;

      if(a.length<24) return {available:false, note: metric==='new_c'
        ? ('Year on Year needs 24+ months; this series has '+a.length+'.')
        : ('Year on Year needs 24+ months of total '+metric+'; the export holds only '+a.length+'. The one 2-year series we have is new-customer acquisition, so YoY is live on the New Customers graph.')};
      var pts=[]; for(var i=12;i<a.length;i++){ var cur=metricVal(a[i],metric), prev=metricVal(a[i-12],metric); if(prev) pts.push({x:a[i].month, y:(cur-prev)/prev*100, label:mLabel(a[i].month)}); }
      if(pts.length<2) return {available:false, note:'Not enough overlapping months for a Year on Year trend.'};
      return {available:true, pct:true, pts:pts, note:'Year-over-year % change: each month vs the same month a year earlier ('+a.length+'-month new-customer acquisition series).'};
    }
    var src = (metric==='new_c') ? (m.acquisition||[]) : (m.monthly||[]);
    if(src.length<2) return {available:false, note:'No monthly series in this market export.'};
    return {available:true, pct:false, pts:src.map(function(x){return {x:x.month, y:metricVal(x,metric), label:mLabel(x.month)};}), note:src.length+' months of real monthly data.'};
  }
  function tvIsMoney(metric){ return metric==='sales'||metric==='aov'; }
  function tvChart(m, metric, view){
    var r=tvData(m, metric, view);
    if(!r.available) return '<div class="empty" style="padding:26px 18px;text-align:center;line-height:1.6">'+esc(r.note)+'</div>';
    var opts={w:820,h:280}; if(view==='yoy'){ opts.yLabel='YoY % change'; }
    if(r.pct){ opts.pct=true; var ys=r.pts.map(function(p){return p.y;}); var lo=Math.min.apply(null,ys), hi=Math.max.apply(null,ys); opts.min=lo<0?lo*1.15:0; opts.max=hi>0?hi*1.15:(hi||1); }
    else if(tvIsMoney(metric)) opts.money=true;
    return lineChart(r.pts, opts)+'<div class="tv-note">'+esc(r.note)+'</div>';
  }
  function tvToggle(m, id, metric, active){
    var tiles=TV_VIEWS.map(function(v){ var r=tvData(m, metric, v.k); var on=v.k===active; var dis=!r.available;
      return '<button type="button" class="tv-tile'+(on?' on':'')+(dis?' dis':'')+'" data-view="'+v.k+'"'+(dis?' title="'+escA(r.note)+'" aria-disabled="true"':'')+'>'+esc(v.label)+'</button>';
    }).join('');
    return '<div class="tv-toggle" role="group" aria-label="Time granularity view">'+tiles+'</div>';
  }

  // ── detail view ───────────────────────────────────────────────────────────
  function openDetail(id){
    var w=WIDGETS.find(function(x){return x.id===id;}); if(!w) return;
    var m=d(); var det; try{ det=w.detail(m); }catch(e){ det={insight:'—',chart:'',table:'',csv:''}; }
    var dl = det.csv ? '<button type="button" class="btn-dl" data-csv="'+det.csv+'">Download CSV</button>' : '';
    var metric=TV_METRIC[id];
    var chartBlock;
    if(metric){
      chartBlock='<div id="tvwrap">'+tvToggle(m,id,metric,'mom')+
        '<div class="w span12" style="margin-top:10px"><div class="wbody" id="tvchart">'+tvChart(m,metric,'mom')+'</div></div></div>';
    } else {
      chartBlock='<div class="w span12" style="margin-top:14px"><div class="wbody">'+(det.chart||'')+'</div></div>';
    }
    document.getElementById('detail').innerHTML =
      '<button type="button" class="crumb" id="backBtn">← Back to dashboard</button>'+
      '<div class="topbar"><div><h1>'+esc(w.title)+'</h1><p class="lede">'+esc(w.sub||'')+' · '+esc(mktLabel())+' market</p></div>'+dl+'</div>'+
      chartBlock+
      (det.insight?'<div class="insight">'+det.insight+'</div>':'')+
      (det.table||'');
    document.getElementById('backBtn').addEventListener('click', closeDetail);
    var dlb=document.querySelector('#detail .btn-dl'); if(dlb) dlb.addEventListener('click',function(){ downloadCSV(dlb.dataset.csv); });
    if(metric){
      document.querySelectorAll('#tvwrap .tv-tile').forEach(function(t){ t.addEventListener('click',function(){
        if(t.classList.contains('dis')) return;
        var v=t.getAttribute('data-view');
        document.querySelectorAll('#tvwrap .tv-tile').forEach(function(x){ x.classList.toggle('on', x===t); });
        var cw=document.getElementById('tvchart'); if(cw) cw.innerHTML=tvChart(m, metric, v);
      }); });
    }
    document.body.classList.add('detailing');
    history.replaceState(null,'','?mkt='+MKT+'#'+id);
    window.scrollTo(0,0);
  }
  function closeDetail(){ document.body.classList.remove('detailing'); history.replaceState(null,'','?mkt='+MKT); window.scrollTo(0,0); }

  function downloadCSV(name){
    var region = meta(MKT).region;
    var url='/data/market/'+region+'/'+name+'.csv';
    var a=document.createElement('a'); a.href=url; a.download=name+'.csv'; document.body.appendChild(a); a.click(); a.remove();
  }

  function renderFootnote(){
    var m=d()||{}; var live=m.__live;
    if(A.__demo){
      document.getElementById('footnote').innerHTML='<b>DEMO DATA</b> - '+esc(A.generated_note||'generated from the active brand’s own offerings; not real performance.');
      return;
    }
    var src = live
      ? 'Source: <b>live Shopify Admin</b> snapshot for '+esc(mktLabel())+' ('+esc(live.store_url||live.shop||meta(MKT).store)+', pulled '+esc(live.pulled_at||'recently')+') overlaying the '+esc(mktLabel())+' market exports.'
      : 'Source: the active brand’s '+esc(mktLabel())+' market exports in <span class="datalink">data/market/'+esc(meta(MKT).region)+'/</span>, compiled by <span class="datalink">scripts/build-market-analytics.js</span>.';
    document.getElementById('footnote').innerHTML=src+' Trailing 12-month window. The upstream ingestion + DuckDB engine lives in the brand’s own data-engine repo (live: <a class="datalink" href="/data-engine">DTC Data Engine</a>).';
  }

  function marketHasData(mk){ var m=A.markets[mk]; return !!(m && Object.keys(m).length && (m.summary || (m.monthly && m.monthly.length))); }
  function renderEmptyMarket(){
    var kp=document.getElementById('kpis'); if(kp) kp.innerHTML='';
    var sg=document.getElementById('signals'); if(sg) sg.innerHTML='';
    var g=document.getElementById('grid');
    if(g) g.innerHTML='<div class="empty" style="padding:32px;text-align:center;line-height:1.7">No analytics loaded for <b>'+esc(mktLabel())+'</b> yet.<br>This view shows <b>only real data</b>. To populate '+esc(mktLabel())+', authorize its Shopify store (<span class="datalink">'+esc(meta(MKT).store)+'</span>) via the connected Shopify MCP, or drop its CSV export into <span class="datalink">data/market/'+esc(meta(MKT).region)+'/</span>. No sample or fabricated figures are ever shown.</div>';
    var fn=document.getElementById('footnote'); if(fn) fn.textContent='Awaiting live data for '+mktLabel()+'. Authorize its Shopify store via the Shopify MCP (or add its CSV export); nothing is fabricated.';
  }

  // The LHS rail follows the tab that is actually SHOWING. This page switches
  // tabs in place (no URL change), so the URL alone cannot tell the rail which
  // sub-item is open - the page names it explicitly.
  var NAV_ID_BY_TAB = {
    control: 'da-control', acq: 'da-acq', ret: 'da-ret', cohort: 'da-cohort',
    'live-ads': 'da-liveads', 'mailer-intelligence': 'da-mailer',
    'landing-intelligence': 'da-landing', 'action-outcomes': 'da-actions',
    'alert-settings': 'da-alerts', review: 'da-review'
  };
  function syncNavToTab(tab){
    try {
      var id = NAV_ID_BY_TAB[tab];
      if (!id) return;
      window.__LC_ACTIVE_ID = id;
      if (typeof window.__LC_NAV_REFRESH === 'function') window.__LC_NAV_REFRESH();
    } catch (_) {}
  }
  function renderMarket(){ if(marketHasData(MKT)){ renderKPIs(); renderSignals(); renderGrid(); renderFootnote(); } else { renderEmptyMarket(); } }
  function setMarket(mk){ MKT=mk; document.querySelectorAll('#mktToggle button').forEach(function(b){ b.classList.toggle('on', b.dataset.mkt===mk); }); renderMarket(); closeDetail(); }

  document.querySelectorAll('#mktToggle button').forEach(function(b){ b.addEventListener('click',function(){ setMarket(b.dataset.mkt); }); });
  // Apply the opening tab (?tab=) to the strip and the rail before any clicks.
  (function applyOpeningTab(){
    var btns = document.querySelectorAll('#anTabs button');
    var found = false;
    btns.forEach(function(x){ var hit = x.dataset.tab === ACTIVE_TAB; x.classList.toggle('on', hit); if (hit) found = true; });
    // A tab this strip does not carry is one of the connector or deep-dive
    // tabs, which mount from data-analysis-extensions.js after this runs. The
    // widget grid falls back to the Control Room set underneath, but the rail
    // is told the REQUESTED tab, or opening a deep link would light up the
    // wrong rail item for the rest of the session.
    if (!found) { btns.forEach(function(x){ x.classList.toggle('on', x.dataset.tab === 'control'); }); }
    syncNavToTab(ACTIVE_TAB);
    if (!found) ACTIVE_TAB = 'control';
  })();
  document.querySelectorAll('#anTabs button').forEach(function(b){ b.addEventListener('click',function(){
    ACTIVE_TAB=b.dataset.tab;
    document.querySelectorAll('#anTabs button').forEach(function(x){ x.classList.toggle('on', x===b); });
    syncNavToTab(ACTIVE_TAB);
    closeDetail(); renderGrid(); window.scrollTo(0,0);
  }); });

  // ── LIVE overlay: prefer the read-only Shopify Admin snapshot pulled via the
  // connected Shopify MCP (data/analytics/live-shopify.json) over the CSV export.
  // Only the fresh time-series (monthly / summary / referrers / sessions) are
  // overlaid; CSV-only datasets (top_by_qty, cohort, etc.) are preserved. Zero
  // fabrication: if the file is absent the CSV exports show unchanged.
  function applyLive(live){
    if(!live || !live.markets) return;
    Object.keys(live.markets).forEach(function(mk){
      var l=live.markets[mk]; if(!l) return;
      var m=A.markets[mk] || (A.markets[mk]={});
      if(l.monthly && l.monthly.length){
        m.monthly=l.monthly;
        m.aov_trend=l.monthly.map(function(x){ return { month:x.month, aov:x.aov, orders:x.orders, sales:x.sales }; });
      }
      if(l.summary) m.summary=Object.assign({}, m.summary||{}, l.summary);
      if(l.referrers) m.referrers=l.referrers;
      if(l.sessions) m.sessions=l.sessions;
      m.__live={ store_url:l.store_url, shop:l.shop, pulled_at:l.pulled_at||live.pulled_at };
    });
  }

  // init — STRICT real-data-only: render only when real data is present;
  // otherwise an honest "no live data" state (never baked/sample numbers).
  // Re-read the global on every boot: the brand-resolution script swaps
  // window.LIFECYCLE_ANALYTICS after this IIFE has parsed (restore for the
  // owner, labelled demo for other brands), and the parse-time binding would
  // otherwise keep rendering the pending placeholder forever.
  function boot(){
    A = window.LIFECYCLE_ANALYTICS || A;
    Object.keys(A.markets||{}).forEach(function(mk){
      var m = A.markets[mk];
      if(!m) return;
      if((!m.aov_trend || !m.aov_trend.length) && m.monthly && m.monthly.length){
        m.aov_trend = m.monthly.map(function(x){ return { month:x.month, aov:x.aov, orders:x.orders, sales:x.sales }; });
      }
    });
    var hasData = A && A.markets && Object.keys(A.markets).some(function(k){ return A.markets[k] && Object.keys(A.markets[k]).length; });
    if(!hasData){
      var g=document.getElementById('grid');
      if(g) g.innerHTML='<div class="empty" style="padding:32px;text-align:center;line-height:1.65">No live data connected yet.<br>This view shows <b>only real data</b> pulled from your connected sources (Supabase / the read-only Shopify, Klaviyo and WebEngage syncs). Once the daily sync populates Supabase, the KPIs, cohorts and channel breakdowns appear here automatically. No sample or static figures are shown.</div>';
      var fn0=document.getElementById('footnote'); if(fn0) fn0.textContent='Awaiting live data from the connected sources.';
      return;
    }
    if(!marketHasData(MKT)){ var k=Object.keys(A.markets).filter(marketHasData); if(k.length) MKT=k[0]; }
    // Regions are BRAND-TRUE: a brand sold only in India shows only an India
    // toggle. Buttons for markets the active dataset has no data for are
    // hidden, not rendered as dead tabs.
    document.querySelectorAll('#mktToggle button').forEach(function(b){
      b.classList.toggle('on', b.dataset.mkt===MKT);
      b.style.display = marketHasData(b.dataset.mkt) ? '' : 'none';
    });
    renderMarket();
    if(marketHasData(MKT)){ var hash=(location.hash||'').replace('#',''); if(hash && WIDGETS.find(function(w){return w.id===hash;})) openDetail(hash); }
  }

  var booted=false; function once(){ if(booted) return; booted=true; boot(); }
  window.__daRefresh = boot;   // brand-resolution script re-renders after swapping the dataset
  fetch('/data/analytics/live-shopify.json',{cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ applyLive(j); })
    .catch(function(){})
    .then(once);
  setTimeout(once, 2500);
})();
</script>
<script defer src="/brand-catalog.js"></script>
<script defer src="/auth.js"></script>
<!-- The connector-backed and deep-dive tabs. Loaded here rather than injected
     into an iframe, so they exist however the page is opened. -->
<script defer src="/data-analysis-extensions.js"></script>
<script src="/brand-demo.js"></script>

<script>
/* Resolve the active brand, then either restore the shipped dataset (tenant
   zero) or replace the workbench with an honest empty state naming the brand.
   Analytics are the sharpest possible cross-brand leak: revenue and AOV read as
   authoritative, so showing another brand's is worse than showing nothing. */
(function () {
  function emptyState(name) {
    var host = document.querySelector('main') || document.body;
    var el = document.createElement('div');
    el.style.cssText = 'max-width:720px;margin:26px auto;padding:22px 24px;border:1px solid var(--brand-line,#e3e3e3);border-radius:14px;font-family:var(--brand-font-body,system-ui,sans-serif);line-height:1.6';
    el.innerHTML =
      '<h2 style="font-family:var(--brand-font-heading,inherit);margin:0 0 10px;font-size:20px">No analytics connected for ' + name + '</h2>' +
      '<p style="margin:0 0 10px;opacity:.82">[DATA REQUIRED BEFORE LAUNCH: analytics exports, ' + name + '.] ' +
      'The dataset compiled into this build describes a different brand, and revenue, AOV and order counts read as authoritative, so it is not substituted here.</p>' +
      '<p style="margin:0;opacity:.82">Connect this brand\'s own commerce or analytics exports, then this workbench fills in.</p>';
    if (host.firstChild) host.insertBefore(el, host.firstChild); else host.appendChild(el);
    // Hide the widgets that would otherwise render zeros as if they were real.
    document.querySelectorAll('[data-widget],.da-grid,.da-tabs').forEach(function (n) { n.style.display = 'none'; });
  }
  function demoBanner(brand) {
    if (document.getElementById('demo-banner')) return;
    var host = document.querySelector('main') || document.body;
    var el = document.createElement('div');
    el.id = 'demo-banner';
    el.style.cssText = 'max-width:980px;margin:14px auto 0;padding:10px 16px;border:1px dashed var(--brand-primary,#c00);border-radius:10px;font-family:var(--brand-font-body,system-ui,sans-serif);font-size:13px;line-height:1.55;opacity:.92';
    el.innerHTML = '<b>DEMO DATA</b> - generated deterministically from <b>' + String((brand && brand.name) || 'this brand').replace(/[<>&]/g, '') + "</b>'s own offerings and regions. Not real performance. Connect this brand's exports to replace it.";
    if (host.firstChild) host.insertBefore(el, host.firstChild); else host.appendChild(el);
  }
  function decide(brand) {
    var ok = window.__restoreAnalytics ? window.__restoreAnalytics(brand) : true;
    if (ok) { if (window.__daRefresh) window.__daRefresh(); return; }
    // Another brand is active: use a labelled demo dataset built from ITS OWN
    // offerings. Only a brand with no offerings on record keeps the empty state.
    if (window.BrandDemo && window.BrandDemo.ready) {
      window.BrandDemo.ready().then(function (ctx) {
        if (ctx && ctx.analytics) {
          window.LIFECYCLE_ANALYTICS = ctx.analytics;
          if (window.KNICKGASM_ANALYTICS) window.KNICKGASM_ANALYTICS = ctx.analytics;
          demoBanner(ctx.brand);
          if (window.__daRefresh) window.__daRefresh();
        } else {
          emptyState((brand && brand.name) || 'this brand');
        }
      });
    } else {
      emptyState((brand && brand.name) || 'this brand');
    }
  }
  function boot() {
    if (window.BrandContext && window.BrandContext.ready) {
      window.BrandContext.ready().then(decide).catch(function () { decide(null); });
    } else { decide(null); }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
