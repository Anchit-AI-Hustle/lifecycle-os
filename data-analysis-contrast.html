<!--
  This page used to BE the Data Analysis route: an iframe around
  data-analysis.html that overwrote the active brand's tokens with one tenant's
  literal palette and injected data-analysis-extensions.js. Two consequences
  made it worth removing rather than fixing. The connector and deep-dive tabs
  existed only when the workbench was opened through this one wrapper, so
  /data-analysis.html itself showed four of nineteen sections; and every brand
  that onboarded saw tenant zero's colours on the one page that reports its own
  revenue.

  The wrapper is gone and the page loads its own sections. This file stays
  because it shipped as a URL, and a URL that once worked is redirected, never
  dropped.
-->
<p>Data Analysis has moved to <a href="/data-analysis">/data-analysis</a>.</p>
<script>location.replace('/data-analysis' + location.search + location.hash);</script>
