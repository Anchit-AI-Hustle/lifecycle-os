<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Analysis — Lifecycle OS</title>
<link rel="icon" href="/favicon.png">
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#FFFFFF}
  #analytics-frame{display:block;width:100%;height:100%;border:0;background:#FFFFFF}
  #load-state{position:fixed;inset:0;display:grid;place-items:center;background:#D0473E;color:#FFFFFF;font-family:Arial,sans-serif;font-weight:700;letter-spacing:.04em;z-index:10}
</style>
</head>
<body>
<div id="load-state">Loading KNICKGASM analytics…</div>
<iframe id="analytics-frame" src="/data-analysis.html" title="Lifecycle OS data analysis"></iframe>
<script>
(function(){
  const frame=document.getElementById('analytics-frame');
  const loader=document.getElementById('load-state');
  const css=`
    :root{
      --violet:#D0473E!important;
      --lava:#6A33D8!important;
      --ink:#111111!important;
      --chalk:#FFFFFF!important;
      --bg:#FFFFFF!important;
      --surface:#FFFFFF!important;
      --tile:#FFFFFF!important;
      --chip:#FFFFFF!important;
      --line:#6A33D8!important;
      --soft:#31483B!important;
      --head:#D0473E!important;
      --accent:#8A682F!important;
      --c1:#D0473E!important;
      --c2:#6A33D8!important;
      --c3:#18794E!important;
      --c4:#9B3A2E!important;
      --c5:#305C89!important;
      --c6:#6A3D7A!important;
    }
    html,body{background:#FFFFFF!important;color:#111111!important}
    body{min-height:100vh!important}
    .wrap{max-width:1440px!important;padding:30px 28px 110px!important}
    h1,h2,h3,.sig-head,.sig-v,.w .wt,.bignum{color:#D0473E!important}
    .eyebrow{color:#8A682F!important}
    p.lede,.kpi .kl,.kpi .kd,.sig-sub,.sig-h,.sig-d,.w .ws,.legend,.note,.empty,.heat td.lbl,.heat th{color:#31483B!important}
    .mkt{background:#FFFFFF!important;border:1px solid #6A33D8!important;box-shadow:0 2px 10px rgba(0,74,43,.08)!important}
    .mkt button{color:#D0473E!important}
    .mkt button:hover{background:#E9DDC6!important}
    .mkt button.on{background:#D0473E!important;color:#FFFFFF!important;box-shadow:0 0 0 2px #6A33D8!important}
    .kpi,.sig,.w{background:#FFFFFF!important;border:1px solid #6A33D8!important;box-shadow:0 6px 18px rgba(0,74,43,.08)!important}
    .kpi .kv{color:#D0473E!important}
    .kpi:hover,.sig:hover,.w.link:hover{border-color:#D0473E!important;box-shadow:0 10px 26px rgba(0,74,43,.16)!important}
    .sig-decomp,.insight{background:#FFFFFF!important;color:#111111!important;border:1px solid #D5C19A!important;border-left:4px solid #6A33D8!important}
    .sig-decomp b,.insight b{color:#D0473E!important}
    .w .open,.crumb{color:#76551F!important}
    .w .open:focus-visible,.crumb:focus-visible,.btn-dl:focus-visible,.mkt button:focus-visible{outline:3px solid #6A33D8!important;outline-offset:2px!important}
    .tbl-wrap{border:1px solid #6A33D8!important;background:#FFFFFF!important}
    table{color:#111111!important;background:#FFFFFF!important}
    th{background:#D0473E!important;color:#FFFFFF!important;border-bottom:2px solid #6A33D8!important}
    td{color:#111111!important;border-bottom:1px solid #D8CCB6!important}
    tbody tr:nth-child(even) td{background:#FFFFFF!important}
    tbody tr:hover td{background:#E7F0EB!important}
    .heat td{color:#111111!important}
    .btn-dl{background:#D0473E!important;color:#FFFFFF!important;border:1px solid #6A33D8!important}
    .datalink{color:#D0473E!important;text-decoration-color:#6A33D8!important}
    .kpi .up,.sig-decomp .up{color:#137547!important}
    .kpi .down,.sig-decomp .down{color:#A52A2A!important}
    svg text{fill:#111111!important;font-weight:600!important}
    svg .axis text,svg .tick text{fill:#111111!important}
    svg line{stroke:#B9AA8C!important;stroke-opacity:.62!important}
    svg path[stroke]{stroke-width:2.5!important}
    svg circle{stroke:#FFFFFF!important;stroke-width:2!important}
    [role="tooltip"],.tooltip,.chart-tooltip{background:#D0473E!important;color:#FFFFFF!important;border:1px solid #6A33D8!important;box-shadow:0 8px 24px rgba(0,0,0,.22)!important}
    @media(max-width:700px){.wrap{padding:20px 14px 90px!important}.topbar{align-items:flex-start!important}}
  `;
  function apply(){
    try{
      const doc=frame.contentDocument||frame.contentWindow.document;
      if(!doc||!doc.head)return;
      let style=doc.getElementById('knickgasm-high-contrast-override');
      if(!style){
        style=doc.createElement('style');
        style.id='knickgasm-high-contrast-override';
        doc.head.appendChild(style);
      }
      style.textContent=css;
      doc.documentElement.setAttribute('data-knickgasm-contrast','high');
      let ext=doc.getElementById('knickgasm-data-analysis-extensions');
      if(!ext){
        ext=doc.createElement('script');
        ext.id='knickgasm-data-analysis-extensions';
        ext.src='/data-analysis-extensions.js?v=20260722';
        ext.defer=true;
        doc.body.appendChild(ext);
      }
      loader.style.display='none';
      const observer=new MutationObserver(()=>{
        if(!doc.getElementById('knickgasm-high-contrast-override'))doc.head.appendChild(style);
      });
      observer.observe(doc.head,{childList:true});
    }catch(err){
      loader.textContent='Dashboard could not be styled. Reload the page.';
      console.error(err);
    }
  }
  frame.addEventListener('load',apply);
})();
</script>
</body>
</html>
